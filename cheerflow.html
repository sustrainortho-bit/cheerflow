          '<div id="ytPlaceholder" style="width:100%;height:44px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:12px;">音声のみ再生中（動画は非表示）</div>'
          : '<div id="ytPlaceholder" style="width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;"></div>') +
        renderTimeline(ytCur, ytDur, '<button class="btn small ghost" id="ytAudioOnlyBtn" type="button">'+(ui.ytAudioOnly?'動画を表示':'音だけ表示')+'</button>') +
        renderTransportRow() +
        '<button class="btn small primary" id="audioAddSceneBtn">+ この位置にシーン追加</button>' +
        renderCountSplitBox(ytDur) +
        '<button class="btn small ghost" id="ytChangeBtn">動画を変更</button>' +
        '<hr class="divider">' +
        '<button class="btn small ghost" id="switchToFileBtn">ファイル音源に切り替える</button>' +
      '</div>';
    }
    var has = !!state.audio.dataUrl;
    var dur = AUDIO_EL.duration || 0;
    var cur = AUDIO_EL.currentTime || 0;
    return '<div class="audio-panel">' +
      '<h2>音源</h2>' +
      '<input type="file" id="audioUpload" accept="audio/*" class="visually-hidden">' +
      '<button class="btn small" id="audioUploadBtn">音源ファイルを選択</button>' +
      '<div class="audio-name">'+escapeHtml(state.audio.name||'未選択')+'</div>' +
      (has ? (
        renderTimeline(cur, dur) +
        renderTransportRow() +
        '<button class="btn small primary" id="audioAddSceneBtn">+ この位置にシーン追加</button>' +
        renderCountSplitBox(dur) +
        '<button class="btn small danger ghost" id="audioRemoveBtn">音源を削除</button>'
      ) : '<p class="empty-hint">音源ファイルをアップロードすると、再生位置に合わせてシーンを追加できます。</p>') +
      '<hr class="divider">' +
      '<button class="btn small ghost" id="switchToYtBtn">代わりにYouTube参考リンクを使う</button>' +
    '</div>';
  }

  /* ---------------- Stage panel (center) ---------------- */
  function renderStagePanel(){
    var sc = currentScene();
    if(!sc) return '<div class="stage-panel"></div>';
    var selIds = ui.selectedIds.filter(function(id){ return sc.presence[id]; });
    var selToolbar = '';
    if(selIds.length>=2){
      var sorted = selIds.slice().sort().join(',');
      var existingGroup = (sc.groups||[]).filter(function(g){ return g.memberIds.slice().sort().join(',')===sorted; })[0];
      selToolbar = '<div class="sel-toolbar">' +
        '<span class="count">'+selIds.length+'個選択中</span>' +
        '<button class="btn small" data-act="arr-row">横並び</button>' +
        '<button class="btn small" data-act="arr-col">縦並び</button>' +
        '<button class="btn small primary" data-act="arr-stunt">スタンツ隊列</button>' +
        '<button class="btn small" data-act="arr-group">'+(existingGroup?'グループ解除':'グループ化')+'</button>' +
        '<button class="btn small ghost icon" data-act="sel-clear">✕</button>' +
      '</div>';
    }
    var countPanel = !ui.sidebarOpen ? renderCountNotesPanel(sc) : '';
    var audienceAtTop = !!state.stage.audienceAtTop;
    return '<div class="stage-panel">' +
      '<div class="stage-row">' +
        '<div class="stage-frame">'+renderStageSvg(sc,{mini:false})+
          '<div class="stage-scene-title">'+(sceneIndex(sc.id)+1)+'. '+escapeHtml(sc.name||'無題のシーン')+'</div>'+
          '<button type="button" class="viewpoint-toggle" id="audienceToggleBtn" title="客席の向きを切り替え">'+
            '⇅ '+(audienceAtTop?'演者視点':'観客視点')+
          '</button>'+
          '<button type="button" class="multisel-toggle'+(ui.multiSelect?' on':'')+'" id="multiSelectToggle" title="オンにすると、タップしたコマを選択に追加・解除できます（Shift＋クリックと同じ）">'+
            (ui.multiSelect?'✓ 複数選択中':'複数選択')+
          '</button>'+
        '</div>' +
        countPanel +
      '</div>' +
      '<textarea class="scene-memo-inline" id="sceneMemoInline" placeholder="このシーンのメモ（動きの説明やキュー、注意点など）">'+escapeHtml(stripHtml(sc.note||''))+'</textarea>' +
      selToolbar +
    '</div>';
  }
  function renderCountNotesPanel(sc){
    var cn = sc.countNotes || {};
    var cells = [];
    for(var c=1;c<=8;c++){
      cells.push('<div class="count-note-cell"><span>'+c+'</span><input type="text" data-act="count-note" data-c="'+c+'" value="'+escapeHtml(stripHtml(cn[c]||''))+'" placeholder="メモ"></div>');
    }
    return '<div class="count-notes-side">' +
      '<h3>カウント別メモ</h3>' +
      cells.join('') +
    '</div>';
  }
  function renderPresenceRow(sc){
    return '<div class="pills-row">'+state.members.map(function(m){
      var on = !!sc.presence[m.id];
      var dotColor = m.color || ('var('+hueVar(m.part||'other', PART_DEFS)+')');
      return '<button type="button" class="pill'+(on?'':' off')+'" data-act="toggle-presence" data-id="'+m.id+'">' +
        '<span class="dot" style="background:'+dotColor+';"></span>'+escapeHtml(m.name)+'</button>';
    }).join('')+'</div>';
  }

  /* ---------------- Side panel (right, toggled by メニュー) ---------------- */
  function renderSidePanel(){
    return '<div class="side-panel">' +
      '<div class="side-tabs" role="tablist">' +
        sideTabBtn('placement','配置') + sideTabBtn('scene','シーン') + sideTabBtn('roster','名簿') + sideTabBtn('stage','ステージ') +
      '</div>' +
      '<div class="side-body">' +
        (ui.sidebarTab==='placement' ? renderPlacementTab() :
         ui.sidebarTab==='scene' ? renderSceneTab() :
         ui.sidebarTab==='roster' ? renderRosterTab() : renderStageSettingsTab()) +
      '</div>' +
    '</div>';
  }
  function sideTabBtn(key, label){
    return '<button class="side-tab-btn" role="tab" data-side-tab="'+key+'" aria-selected="'+(ui.sidebarTab===key)+'">'+label+'</button>';
  }

  function renderPlacementTab(){
    var sc = currentScene();
    var selIds = ui.selectedIds.filter(function(id){ return sc.presence[id]; });
    var out = [];
    out.push('<h2 style="font-size:12px;margin:0;">人数</h2>');
    out.push('<div class="headcount-row"><button class="btn small icon" data-act="hc-minus">−</button><span class="num mono">'+state.members.length+'人</span><button class="btn small icon" data-act="hc-plus">＋</button></div>');
    out.push('<hr class="divider">');
    out.push('<details class="collapse"><summary>出演メンバー（このシーン）</summary>' +
      '<div style="margin-top:8px;">'+renderPresenceRow(sc)+'</div>' +
    '</details>');
    out.push('<hr class="divider">');
    out.push('<details class="collapse"><summary>配置のプリセット</summary>' +
      '<div style="display:flex;flex-direction:column;gap:8px;margin-top:8px;">' +
      '<p class="empty-hint" style="margin:0;">選択中のコマ（未選択なら出演中の全員）に適用します。</p>' +
      '<div class="preset-grid">' +
        '<button class="btn small" data-act="preset-row">横一列</button>' +
        '<button class="btn small" data-act="preset-col">縦一列</button>' +
        '<button class="btn small" data-act="preset-v">V字</button>' +
        '<button class="btn small" data-act="preset-arc">円形</button>' +
        '<button class="btn small" data-act="preset-block">ブロック</button>' +
        '<button class="btn small" data-act="preset-auto">自動整列</button>' +
      '</div>' +
      '<button class="btn small" data-act="copy-prev" style="width:100%;" '+(sceneIndex(sc.id)<=0?'disabled':'')+'>直前のシーンの配置にセット</button>' +
      '<div style="display:flex;gap:6px;">' +
        '<button class="btn small" data-act="copy-formation" style="flex:1;">フォーメーションをコピー</button>' +
        '<button class="btn small" data-act="paste-formation" style="flex:1;" '+(ui.formationClipboard?'':'disabled')+'>フォーメーションを貼り付け</button>' +
      '</div>' +
      '</div>' +
    '</details>');
    out.push('<hr class="divider">');
    out.push('<h2 style="font-size:12px;margin:0;">グループ化</h2>');
    out.push('<button class="btn small" data-act="group-toggle" style="width:100%;" '+(selIds.length<2?'disabled':'')+'>選択中をグループ化／解除</button>');
    out.push('<hr class="divider">');
    out.push('<h2 style="font-size:12px;margin:0;">スタンツの種類</h2>');
    out.push('<p class="empty-hint" style="margin:0;">'+(selIds.length<2?'コマを2つ以上選択してから技を選ぶと新しいスタンツになります。':'技を選ぶと選択中のコマで新しいスタンツを作成します。')+'</p>');
    out.push(renderStuntPictoPicker({ act:'create-stunt-pick', disabled: selIds.length<2 }));
    var stuntGroups = stuntGroupsOf(sc);
    if(stuntGroups.length){
      out.push('<div style="display:flex;flex-direction:column;gap:8px;margin-top:8px;">' +
        stuntGroups.map(function(g, i){
          var isSel = selIds.length && g.memberIds.indexOf(selIds[0])>=0 && selIds.every(function(id){ return g.memberIds.indexOf(id)>=0; }) && selIds.length===g.memberIds.length;
          return '<div class="stunt-list-row'+(isSel?' active':'')+'">' +
            '<div class="stunt-list-head"><strong>スタンツ'+(i+1)+'</strong>' +
              '<button class="btn small ghost icon" type="button" data-act="stunt-list-select" data-gid="'+g.id+'" title="このスタンツを選択">◎</button>' +
            '</div>' +
            '<p class="empty-hint" style="margin:0;">'+escapeHtml(groupLabel(g))+'</p>' +
            renderStuntPictoPicker({ currentVal:g.stuntType, act:'stunt-list-pick', extraAttrs:'data-gid="'+g.id+'"' }) +
            '<div style="display:flex;gap:6px;">' +
              '<button class="btn small danger ghost" type="button" data-act="stunt-list-ungroup" data-gid="'+g.id+'" style="flex:1;">解除</button>' +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>');
    }
    if(selIds.length===1){
      var posForSel = sc.positions[selIds[0]];
      var curSkill = (posForSel && posForSel.tumbleSkill) || '';
      out.push('<hr class="divider">');
      out.push('<h2 style="font-size:12px;margin:0;">タンブリング移動</h2>');
      out.push('<p class="empty-hint">前シーンからの移動をタンブリングにする場合、技を選択すると移動線が一点鎖線になり、技名が表示されます。</p>');
      out.push('<select id="tumbleSkillSelect" style="width:100%;border:1px solid var(--border);background:var(--surface);padding:6px 8px;border-radius:7px;">' +
        '<option value="">なし</option>' +
        TUMBLE_SKILL_ORDER.map(function(k){ return '<option value="'+k+'" '+(curSkill===k?'selected':'')+'>'+TUMBLE_SKILLS[k]+'</option>'; }).join('') +
      '</select>');
    }
    out.push('<hr class="divider">');
    out.push('<h2 style="font-size:12px;margin:0;">整列</h2>');
    out.push('<div class="align-grid">' +
      '<button class="btn small" data-act="align-cx" '+(!selIds.length?'disabled':'')+'>左右中央</button>' +
      '<button class="btn small" data-act="align-cy" '+(!selIds.length?'disabled':'')+'>上下中央</button>' +
      '<button class="btn small" data-act="align-eq" '+(selIds.length<3?'disabled':'')+'>等間隔</button>' +
      '<button class="btn small" data-act="align-mirror" '+(!selIds.length?'disabled':'')+'>左右反転</button>' +
    '</div>');
    out.push('<button class="btn small danger" data-act="sel-remove" style="width:100%;" '+(!selIds.length?'disabled':'')+'>選択コマをこのシーンから削除</button>');
    out.push('<hr class="divider">');
    out.push('<h2 style="font-size:12px;margin:0;">コマの大きさ</h2>');
    out.push('<div class="range-row"><input type="range" id="komaScale" min="60" max="220" value="'+(state.stage.komaScale||100)+'"><span class="mono" id="komaScaleVal" style="width:38px;">'+(state.stage.komaScale||100)+'%</span></div>');
    out.push(toggleRow('snapGrid','グリッドスナップ', state.stage.snapGrid));
    return out.join('');
  }

  function renderSceneTab(){
    var sc = currentScene();
    var sectionOptions = SECTION_ORDER.map(function(k){
      return '<option value="'+k+'" '+(sc.section===k?'selected':'')+'>'+SECTION_DEFS[k].label+'</option>';
    }).join('');
    var countNoteCells = [];
    for(var c2=1;c2<=8;c2++){
      countNoteCells.push('<div class="count-note-cell"><span>'+c2+'</span><input type="text" data-act="count-note" data-c="'+c2+'" value="'+escapeHtml(stripHtml((sc.countNotes||{})[c2]||''))+'" placeholder="メモ"></div>');
    }
    var out = [];
    out.push(field('シーン名','text','sceneName',sc.name||''));
    out.push('<div class="field"><label for="sceneColor">色アイコン</label><input type="color" id="sceneColor" value="'+escapeHtml(sc.color||'#8d8698')+'"></div>');
    out.push('<div class="field"><label for="sceneSection">セクション</label><select id="sceneSection">'+sectionOptions+'</select></div>');
    out.push('<div class="field"><label for="sceneStartSec">開始時間（秒）</label><input type="number" id="sceneStartSec" step="0.1" min="0" value="'+(sc.startSec!=null?sc.startSec:'')+'" placeholder="例: 12.5"></div>');
    out.push('<hr class="divider">');
    out.push('<div class="field"><label>カウント別メモ</label><div class="count-notes-grid">'+countNoteCells.join('')+'</div></div>');
    out.push('<hr class="divider">');
    out.push('<div class="field"><label for="sceneNote">シーン全体のメモ</label><textarea id="sceneNote" style="min-height:70px;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:9px;" placeholder="動きの説明やキュー、注意点など">'+escapeHtml(stripHtml(sc.note||''))+'</textarea></div>');
    out.push('<details class="collapse"><summary>追加設定</summary>' +
      '<div style="display:flex;flex-direction:column;gap:10px;margin-top:8px;">' +
      '<div class="field"><label for="sceneVideo">参考動画リンク</label><input type="url" id="sceneVideo" placeholder="https://" value="'+escapeHtml(sc.videoLink||'')+'"></div>' +
      '<button class="btn small" id="openVideoBtn" type="button" '+(sc.videoLink?'':'disabled')+'>▶ 動画を開く</button>' +
      '<div class="field"><label for="sceneLighting">照明メモ</label><input type="text" id="sceneLighting" placeholder="例: 青ホリゾント／サビで全点灯" value="'+escapeHtml(sc.lightingNote||'')+'"></div>' +
      toggleRow('toggleIncoming','前シーンからの動線', sc.showIncomingPath) +
      toggleRow('toggleActualPath','実際の軌跡で表示', sc.useActualPath) +
      '</div>' +
    '</details>');
    return out.join('');
  }

  function renderRosterTab(){
    var rows = state.members.map(function(m){
      var opts = PART_ORDER.map(function(k){ return '<option value="'+k+'" '+(m.part===k?'selected':'')+'>'+PART_DEFS[k].label+'</option>'; }).join('');
      return '<div class="roster-row" data-id="'+m.id+'">' +
        '<input type="color" data-act="member-color" value="'+escapeHtml(m.color||'#8d8698')+'" title="コマの色">' +
        '<input type="text" data-act="member-name" value="'+escapeHtml(m.name)+'">' +
        '<select data-act="member-part">'+opts+'</select>' +
        '<button class="btn small danger ghost icon" data-act="member-del" data-id="'+m.id+'">×</button>' +
      '</div>';

      '<div style="display:flex;flex-direction:column;gap:6px;">'+rows+'</div>' +
      '<button class="btn small" id="memberAddBtn">+ メンバー追加</button>' +
      '<hr class="divider">' +
      '<div class="field"><label for="bulkNames">一括追加（1行に1名）</label><textarea id="bulkNames" style="min-height:80px;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:9px;" placeholder="田中\n鈴木"></textarea></div>' +
      '<button class="btn small" id="bulkAddBtn">名簿に追加</button>';
  }

  /* ---------------- Footer scene strip ---------------- */
  function renderFooterStrip(){
    var sc = currentScene();
    var cards = state.scenes.map(function(s, i){
      var sect = SECTION_DEFS[s.section] || SECTION_DEFS.transition;
      return '<div class="thumb-card'+(s.id===sc.id?' active':'')+'" data-scene-id="'+s.id+'" title="'+escapeHtml(s.name||'')+'">' +
        '<div class="strip" style="background:'+(s.color||sect.color)+';"></div>' +
        renderStageSvg(s,{mini:true}).replace('class="stage-svg"','class="stage-svg mini"') +
        '<div class="label">'+(i+1)+'. '+escapeHtml(s.name||'無題')+'</div>' +
        '<div class="ctrls">' +
          '<button data-act="thumb-left" data-id="'+s.id+'" title="左へ移動" '+(i===0?'disabled':'')+'>←</button>' +
          '<button data-act="thumb-right" data-id="'+s.id+'" title="右へ移動" '+(i===state.scenes.length-1?'disabled':'')+'>→</button>' +
          '<button data-act="thumb-dup" data-id="'+s.id+'" title="複製">⧉</button>' +
          '<button data-act="thumb-del" data-id="'+s.id+'" title="削除" '+(state.scenes.length<=1?'disabled':'')+'>×</button>' +
        '</div>' +
      '</div>';
    }).join('');
    return '<footer class="footer-strip">' + cards + '<button class="thumb-add" id="footerAddBtn" title="シーン追加">＋</button></footer>';
  }

  /* ---------------- Stunt drawer ---------------- */
  /* ---------------- Present overlay ---------------- */
  function renderPresentOverlay(){
    var sc = state.scenes[ui.presentIndex] || state.scenes[0];
    if(!sc) return '';
    var sect = SECTION_DEFS[sc.section] || SECTION_DEFS.transition;
    var dots = state.scenes.map(function(s,i){
      return '<button class="'+(i===ui.presentIndex?'on':'')+'" data-idx="'+i+'" aria-label="シーン'+(i+1)+'"></button>';
    }).join('');
    var cn = sc.countNotes || {};
    var cnRows = [];
    for(var c=1;c<=8;c++){ cnRows.push('<div class="present-cn-row"><b>'+c+'</b><span>'+escapeHtml(stripHtml(cn[c]||''))+'</span></div>'); }
    return '<div class="present-overlay" role="dialog" aria-modal="true">' +
      '<div class="present-top">' +
        '<button class="btn ghost icon" id="presentClose">✕ 終了</button>' +
        '<div class="header-spacer"></div>' +
        '<span class="mono" style="color:var(--text-muted);">'+(ui.presentIndex+1)+' / '+state.scenes.length+'</span>' +
      '</div>' +
      '<div class="present-body">' +
        '<div class="present-stage-wrap">'+renderStageSvg(sc,{mini:false}).replace(' stage-main','')+'</div>' +
        '<div class="present-countnotes-side"><h3>カウント別メモ</h3><div class="present-cn-grid">'+cnRows.join('')+'</div></div>' +
      '</div>' +

  function resolveSvgColors(svgStr){
    var cs = getComputedStyle(document.documentElement);
    return svgStr.replace(/var\((--[a-z-]+)\)/g, function(m, name){
      var v = cs.getPropertyValue(name);
      return v ? v.trim() : '#000';
    });
  }
  function svgToPngBlob(svgString, width, height){
    return new Promise(function(resolve, reject){
      var blob = new Blob([svgString], {type:'image/svg+xml;charset=utf-8'});
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function(){
        var canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        canvas.toBlob(function(b){ b ? resolve(b) : reject(new Error('toBlob failed')); }, 'image/png');
      };
      img.onerror = function(e){ URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }
  function standaloneSvg(scene){
    var markup = renderStageSvg(scene, {mini:false}).replace(' stage-main','');
    markup = markup.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="'+VB_W+'" height="'+VB_H+'" ');
    return resolveSvgColors(markup);
  }
  function downloadViaBlobLink(filename, data){
    var blob = (data instanceof Blob) ? data : new Blob([data], {type:'application/octet-stream'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }
  function saveViaDownloads(filename, data){
    if(hasArtifactApi){
      // Inside the Claude Artifact sandbox a plain <a download> link is inert,
      // so this path must go through the downloads capability or fail visibly.
      window.claude.use('downloads').then(function(dl){
        if(!dl){ alert('この表示環境ではダウンロードが許可されていません。自己ホスティングした環境ではダウンロードできます。'); return; }
        dl.save({ filename:filename, data:data }).catch(function(err){
          if(err && err.code==='declined') return;
          alert('書き出しに失敗しました: '+(err&&err.message||''));
        });
      }, function(){ alert('この表示環境ではダウンロードが許可されていません。自己ホスティングした環境ではダウンロードできます。'); });
    } else {
      downloadViaBlobLink(filename, data);
    }
  }
  function exportCurrentPng(){

    svgToPngBlob(standaloneSvg(sc), VB_W*EXPORT_SCALE, VB_H*EXPORT_SCALE).then(function(blob){

    }).catch(function(){ alert('PNGの生成に失敗しました。'); });
  }
  function exportContactSheet(scenes, filename){
    var cols = Math.ceil(Math.sqrt(scenes.length));
    var rows = Math.ceil(scenes.length/cols);
    var cw = 640, gap = 28, labelH = 34;
    var cellImgH = Math.round(cw*VB_H/VB_W);
    var ch = cellImgH + labelH;
    var pitchW = cw + gap, pitchH = ch + gap;
    var promises = scenes.map(function(sc){ return svgToPngBlob(standaloneSvg(sc), VB_W*EXPORT_SCALE, VB_H*EXPORT_SCALE); });
    Promise.all(promises).then(function(blobs){
      var canvas = document.createElement('canvas');
      canvas.width = cols*pitchW + gap; canvas.height = rows*pitchH + gap;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      var loaded = blobs.map(function(b){ return new Promise(function(res){
        var img = new Image();
        img.onload = function(){ res(img); };
        img.src = URL.createObjectURL(b);
      }); });
      Promise.all(loaded).then(function(imgs){
        imgs.forEach(function(img, i){
          var r = Math.floor(i/cols), c = i%cols;
          var x = gap + c*pitchW, y = gap + r*pitchH;
          ctx.strokeStyle = '#dddddd'; ctx.strokeRect(x, y, cw, cellImgH);
          ctx.drawImage(img, x, y, cw, cellImgH);
          ctx.fillStyle = '#333'; ctx.font = '18px sans-serif';
          ctx.fillText((i+1)+'. '+(scenes[i].name||'無題'), x+4, y+cellImgH+24);
        });
        canvas.toBlob(function(blob){ saveViaDownloads(filename, blob); }, 'image/png');
      });
    }).catch(function(){ alert('コンタクトシートの生成に失敗しました。'); });
  }

  /* ================= 閲覧専用リンク ================= */
  /* 基本方式：Firestore（viewSnapshotsコレクション、一度作成したら書き換え不可）にスナップショットを
     保存し、"?rv=<ドキュメントID>" という短いURLを発行する。LINE等のメッセージアプリでも問題なく
     送れる長さになる上、外部の短縮URLサービスにルーティン内容を送らずに済む。
     Firestoreが使えない場合（読み込み失敗・オフライン等）は、状態をURLハッシュに直接圧縮埋め込みする
     旧方式（#v=...）にフォールバックする。#v=...はURLのハッシュ部分なのでサーバーには送信されず、
     通信経路上のURL長制限は受けない。制約になるのは主要ブラウザ自体のURL長上限のみ（Firefoxが最も
     厳しく実用上6万文字強）なので、それより十分余裕を持たせた値にする。 */
  var VIEW_LINK_MAX_LEN = 60000;
  function buildViewOnlyState(){
    var copy = JSON.parse(JSON.stringify(state));
    var audioStripped = false;
    if(copy.audio && copy.audio.sourceType==='file' && copy.audio.dataUrl){
      copy.audio.dataUrl = '';
      audioStripped = true;
    }
    return { state:copy, audioStripped:audioStripped };
  }
  function generateViewOnlyHashUrl(){
    var built = buildViewOnlyState();
    var compressed = LZString.compressToEncodedURIComponent(JSON.stringify(built.state));
    var url = location.origin + location.pathname + '#v=' + compressed;
    return { url:url, audioStripped:built.audioStripped };
  }
  function openShareViewLink(){
    if(!cfDb){
      var fallback = generateViewOnlyHashUrl();
      if(fallback.url.length > VIEW_LINK_MAX_LEN){
        alert('プロジェクトの内容が多く、この形式のリンクを作成できませんでした（シーン数やメモを減らすと作成できる場合があります）。');
        return;
      }
      ui.shareViewUrl = fallback.url;
      ui.shareViewAudioStripped = fallback.audioStripped;
      ui.shareViewOpen = true;
      return;
    }
    ui.shareViewOpen = true;
    ui.shareViewLoading = true;
    ui.shareViewUrl = '';
    ui.shareViewAudioStripped = false;
    var built = buildViewOnlyState();
    cfDb.collection('viewSnapshots').add({ state:built.state, createdAt:Date.now() }).then(function(docRef){
      ui.shareViewUrl = location.origin + location.pathname + '?rv=' + docRef.id;
      ui.shareViewAudioStripped = built.audioStripped;
      ui.shareViewLoading = false;
      render();
    }).catch(function(){
      /* Firestoreへの保存に失敗した場合は、旧方式（URLへの直接埋め込み）にフォールバックする */
      var fallback = generateViewOnlyHashUrl();
      if(fallback.url.length > VIEW_LINK_MAX_LEN){
        ui.shareViewOpen = false;
        ui.shareViewLoading = false;
        alert('共有リンクの作成に失敗しました。しばらくしてからもう一度お試しください。');
        render();
        return;
      }
      ui.shareViewUrl = fallback.url;
      ui.shareViewAudioStripped = fallback.audioStripped;
      ui.shareViewLoading = false;
      render();
    });
  }

    });
    onAll('[data-act="note-scene-memo"]','blur', function(){
      pushHistory();
      var sc = findScene(this.getAttribute('data-scene-id'));
      sc.note = sanitizeRichText(this.innerHTML);
      markDirty(); render();
    });
    (function(){
      var toolbar = document.getElementById('noteToolbar');
      if(!toolbar) return;
      try{ document.execCommand('styleWithCSS', false, true); }catch(e){}
      function activeRichCell(){
        var el = document.activeElement;
        return (el && el.classList && el.classList.contains('rich-cell')) ? el : null;
      }
      /* mousedownのpreventDefaultはボタン押下時にcontenteditableがフォーカスを失うのを防ぐ
         （clickイベント自体は引き続き発火する）。一方touchstartでpreventDefaultすると、
         実機（iOS Safari）ではタップ後に本来発火するはずのclickイベントの合成そのものが
         抑止されてしまい、ボタンのクリックハンドラが一切実行されなくなる不具合を引き起こした
         （太字/下線/文字色/カラーパレット開閉のすべてが無反応になっていた）。
         そのためtouchstartへの登録は行わない。iOS選択解除への対策は下のselectionchange経由の
         restoreSelection()で行う。 */
      function preserveFocus(e){ e.preventDefault(); }
      Array.prototype.forEach.call(toolbar.querySelectorAll('button'), function(b){
        b.addEventListener('mousedown', preserveFocus);
      });
      /* iOS Safariはネイティブのテキスト選択（選択ハンドル）を持っており、選択範囲外を
         タップすると、こちら側のpreventDefault()とは無関係にOS側で選択が解除されてしまう
         ことがある。これが起きると太字/下線/文字色ボタンを押した時には選択が空になっており、
         execCommandが「次に入力する文字の書式」としてカーソル位置に適用されるだけで、
         既に書かれていた（選択していたはずの）文字には反映されない。
         そこでselectionchangeで「リッチセル内で選択範囲が非collapsedだった直近の状態」を
         保持しておき、書式ボタンを押した瞬間に必ずその選択とフォーカスを明示的に復元してから
         execCommandを呼ぶようにする。 */
      var savedRange = null, savedCell = null;
      document.addEventListener('selectionchange', function(){
        var sel = window.getSelection();
        if(!sel.rangeCount || sel.isCollapsed) return;
        var range = sel.getRangeAt(0);
        var container = range.commonAncestorContainer;
        var el = container.nodeType===3 ? container.parentElement : container;
        var cell = el && el.closest ? el.closest('.rich-cell') : null;
        if(cell){ savedRange = range.cloneRange(); savedCell = cell; }
      });
      function restoreSelection(){
        if(!savedRange || !savedCell) return;
        if(document.activeElement !== savedCell) savedCell.focus();
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange);
      }
      /* execCommand('bold')/('underline')は実機のiOS Safari(WebKit)では選択範囲があっても
         見た目に反映されないことが報告された（文字色・文字サイズは同じexecCommand経由でも
         問題なく動く）。WebKit側のbold/underlineのトグル判定に絡む既知の相性問題の可能性が
         あるため、execCommandに頼らずRangeを直接ラップする自前実装に置き換える。 */
      function wrapSelectionWithTag(tagName){
        restoreSelection();
        var sel = window.getSelection();
        if(!sel.rangeCount || sel.isCollapsed) return;
        var range = sel.getRangeAt(0);
        var wrapper = document.createElement(tagName);
        try{
          range.surroundContents(wrapper);
        }catch(e){
          var contents = range.extractContents();
          wrapper.appendChild(contents);
          range.insertNode(wrapper);
        }
        var newRange = document.createRange();
        newRange.selectNodeContents(wrapper);
        sel.removeAllRanges();
        sel.addRange(newRange);
        savedRange = newRange.cloneRange();
        savedCell = activeRichCell() || savedCell;
      }
      on('noteBoldBtn','click', function(){ wrapSelectionWithTag('b'); });
      on('noteUnderlineBtn','click', function(){ wrapSelectionWithTag('u'); });
      function stepFontSize(delta){
        restoreSelection();
        var activeCell = activeRichCell();
        if(!activeCell) return;
        var sel = window.getSelection();
        if(!sel.rangeCount || sel.isCollapsed) return;
        /* anchorNodeは選択全体を囲む要素(例: selectNodeContentsした外側のcontenteditable div)を
           指すことがあり、その場合は常にセルの基準フォントサイズを読んでしまい多段階の
           拡大縮小が積み上がらない。Rangeの開始位置から実際のテキストノードまで辿って
           現在選択されているテキスト自身のサイズを読み取る。 */
        var range = sel.getRangeAt(0);
        var node = range.startContainer;
        if(node.nodeType!==3){
          var child = node.childNodes[range.startOffset] || node.childNodes[range.startOffset-1] || node.firstChild;
          while(child && child.nodeType!==3 && child.firstChild) child = child.firstChild;
          node = child || node;
        }
        var el = node && node.nodeType===3 ? node.parentElement : node;
        var baseSize = (el ? parseFloat(getComputedStyle(el).fontSize) : 14) || 14;
        var newSize = Math.max(10, Math.min(32, Math.round(baseSize+delta)));
        /* styleWithCSSがonだとfontSizeコマンドはfont[size]タグを作らずCSSキーワード(xxx-large等)を
           直接付与してしまい、px単位での正確な段階調整ができない。一時的にoffにしてレガシーな
           <font size="7">を確実に生成させ、それをpx指定のstyleに置き換えてから元に戻す。 */
        document.execCommand('styleWithCSS', false, false);
        document.execCommand('fontSize', false, '7');
        document.execCommand('styleWithCSS', false, true);
        Array.prototype.forEach.call(activeCell.querySelectorAll('font[size="7"]'), function(f){
          f.removeAttribute('size');
          f.style.fontSize = newSize+'px';
        });
      }
      on('noteFontIncBtn','click', function(){ stepFontSize(2); });
      on('noteFontDecBtn','click', function(){ stepFontSize(-2); });
      on('noteColorBtn','click', function(e){

      if(e.target.closest('button')) return;
      if(footerJustDragged){ footerJustDragged = false; return; }
      selectScene(this.getAttribute('data-scene-id'));
    });
    (function(){
      var DRAG_THRESHOLD = 8;
      var LONG_PRESS_MS = 400;
      function computeDropIndex(clientX, draggedEl){
        var strip = document.querySelector('.footer-strip');
        var cards = Array.prototype.filter.call(strip.querySelectorAll('.thumb-card'), function(c){ return c!==draggedEl; });
        for(var i=0;i<cards.length;i++){
          var r = cards[i].getBoundingClientRect();
          if(clientX < r.left + r.width/2){ return { index:i, beforeEl:cards[i] }; }
        }
        return { index:cards.length, beforeEl:null };
      }
      function showDropIndicator(beforeEl){
        var strip = document.querySelector('.footer-strip');
        var ind = document.getElementById('thumbDropIndicator');
        if(!ind){
          ind = document.createElement('div');
          ind.id = 'thumbDropIndicator';
          ind.className = 'thumb-drop-indicator';
        }
        var refEl = beforeEl || document.getElementById('footerAddBtn');
        if(refEl) strip.insertBefore(ind, refEl);
      }
      function removeDropIndicator(){
        var ind = document.getElementById('thumbDropIndicator');
        if(ind && ind.parentElement) ind.parentElement.removeChild(ind);
      }
      /* タッチ操作の場合、.thumb-cardはtouch-action:noneでブラウザの横スクロールを止めているため、
         すぐにドラッグ判定にしてしまうと指を横に滑らせてカードを流し見すること（スライド）ができなくなる。
         そこで「長押し（LONG_PRESS_MS）で確定するまでは動かした分だけ手動でstrip.scrollLeftを動かす」
         方式にし、長押しが成立して初めて並び替えドラッグへ移行する。マウス操作は従来通り
         わずかな移動（DRAG_THRESHOLD）で即ドラッグ開始する（スライド操作と衝突しないため）。 */
      onAll('.thumb-card','pointerdown', function(e){
        if(e.target.closest('.ctrls')) return;
        var el = this;
        var strip = document.querySelector('.footer-strip');
        var isTouch = e.pointerType==='touch' || e.pointerType==='pen';
        var st = {
          fromIndex: sceneIndex(el.getAttribute('data-scene-id')),
          pointerId: e.pointerId, startX: e.clientX, startY: e.clientY,
          didDrag: false, dropIndex: null, el: el,
          isTouch: isTouch, longPressArmed: !isTouch, scrolling: false,
          scrollStartLeft: strip ? strip.scrollLeft : 0,
          longPressTimer: null
        };
        footerDragState = st;
        try{ el.setPointerCapture(e.pointerId); }catch(err){}
        if(isTouch){
          st.longPressTimer = setTimeout(function(){
            if(footerDragState===st && !st.scrolling){
              st.longPressArmed = true;
              st.didDrag = true;
              st.el.classList.add('dragging');
            }
          }, LONG_PRESS_MS);
        }
      });
      onAll('.thumb-card','pointermove', function(e){
        var st = footerDragState;
        if(!st || st.pointerId!==e.pointerId) return;
        var dx = e.clientX-st.startX, dy = e.clientY-st.startY;

        if(st.isTouch && !st.longPressArmed){
          if(!st.scrolling){
            if(Math.abs(dx)<DRAG_THRESHOLD && Math.abs(dy)<DRAG_THRESHOLD) return;
            clearTimeout(st.longPressTimer);
            st.scrolling = true;
          }
          var strip = document.querySelector('.footer-strip');
          if(strip) strip.scrollLeft = st.scrollStartLeft - dx;
          return;
        }

        if(!st.didDrag){
          if(Math.abs(dx)<DRAG_THRESHOLD && Math.abs(dy)<DRAG_THRESHOLD) return;
          st.didDrag = true;
          st.el.classList.add('dragging');
        }
        var drop = computeDropIndex(e.clientX, st.el);
        st.dropIndex = drop.index;
        showDropIndicator(drop.beforeEl);
      });
      function finishDrag(e){
        var st = footerDragState;
        if(!st || st.pointerId!==e.pointerId) return;
        clearTimeout(st.longPressTimer);
        footerDragState = null;
        st.el.classList.remove('dragging');
        removeDropIndicator();
        if(st.scrolling){ footerJustDragged = true; return; }
        if(!st.didDrag) return;
        footerJustDragged = true;
        if(st.dropIndex!=null && st.dropIndex!==st.fromIndex){
          pushHistory();
          moveScene(st.fromIndex, st.dropIndex);
          markDirty();
          render();
        }
      }
      onAll('.thumb-card','pointerup', finishDrag);
      onAll('.thumb-card','pointercancel', finishDrag);
    })();

  function swapScenes(i,j){ var tmp=state.scenes[i]; state.scenes[i]=state.scenes[j]; state.scenes[j]=tmp; }

    var item = state.scenes.splice(fromIdx, 1)[0];
    state.scenes.splice(toIdx, 0, item);
  }
  function duplicateScene(idx, flip){
    var src = state.scenes[idx];
    var positions = {};
    Object.keys(src.positions).forEach(function(id){
      var p = src.positions[id];
      positions[id] = { x: flip ? 100-p.x : p.x, y: p.y };
    });
    var groups = (src.groups||[]).map(function(g){
      return { id:uid('grp'), type:g.type, stuntType:g.stuntType, memberIds:g.memberIds.slice() };
    });
    var copy = {
      id:uid('sc'), name: src.name + (flip?'（反転）':'のコピー'), section:src.section, color:src.color,
      timeLabel:src.timeLabel, startSec:null, countNotes:Object.assign({}, src.countNotes||{}),
      note:src.note, videoLink:src.videoLink, lightingNote:src.lightingNote,
      showIncomingPath:src.showIncomingPath, useActualPath:false,
      presence:Object.assign({}, src.presence), positions:positions, groups:groups
    };
    state.scenes.splice(idx+1, 0, copy);
    state.currentSceneId = copy.id;
  }
  function addScene(opts){
    opts = opts || {};
    var sc = currentScene();
    var ns = {
      id:uid('sc'), name:'新しいシーン', section:'transition', color:'#8d8698', timeLabel:'',
      startSec: opts.startSec!=null ? opts.startSec : null,
      countNotes:{},
      note:'', videoLink:'', lightingNote:'', showIncomingPath:true, useActualPath:false,
      presence: sc ? Object.assign({}, sc.presence) : {},
      positions: sc ? JSON.parse(JSON.stringify(sc.positions)) : {},
      groups: sc ? JSON.parse(JSON.stringify(sc.groups||[])) : []
    };

  /* カウント生成は何回目かを各シーンのcountBatchに記録する。2曲をつなげた音源では曲ごとに
     BPMが違うので、曲ごとに①・終点をマークして生成し直す運用になる。
     n回目に生成したシーンは「n-1, n-2, …」と名付け、それまでに生成したシーンには手を付けない。 */
  function nextCountBatch(){
    var max = 0;
    state.scenes.forEach(function(s){ if(s.countBatch>max) max = s.countBatch; });
    return max + 1;
  }
  function countSplitPlan(cs){
    var interval = 60/cs.bpm*8;
    var n = Math.floor((cs.markEnd-cs.markA)/interval) + 1;
    var batch = nextCountBatch();
    /* 新規プロジェクト直後の「シーン1」1つだけの状態なら、それを1つ目のシーンとして使う */
    var only = state.scenes.length===1 ? state.scenes[0] : null;
    var reuseFirst = !!(only && !only.countBatch);
    var inRange = state.scenes.filter(function(s){
      return s.startSec!=null && s.startSec>=cs.markA-0.05 && s.startSec<=cs.markEnd+0.05;
    }).length;
    return { interval:interval, n:n, batch:batch, reuseFirst:reuseFirst, inRange:reuseFirst ? 0 : inRange };
  }
  function generateCountScenes(){
    var cs = ui.countSplit;
    if(!cs || !(cs.bpm>0) || cs.markA==null || cs.markEnd==null || cs.markEnd<=cs.markA) return;
    var plan = countSplitPlan(cs);
    if(plan.n<1) return;
    var msg = '『'+fmtAudioTime(cs.markA)+'』から『'+fmtAudioTime(cs.markEnd)+'』までBPM'+cs.bpm+'（8カウント='+plan.interval.toFixed(2)+'秒）間隔で、' +
      'シーン「'+plan.batch+'-1」〜「'+plan.batch+'-'+plan.n+'」の'+plan.n+'個を生成します。';
    if(plan.batch>1) msg += '\nこれまでに生成したシーンはそのまま残ります。';
    if(plan.inRange) msg += '\n※この範囲にはすでにシーンが'+plan.inRange+'個あります（消さずに残します）。';
    if(!confirm(msg + '\nよろしいですか？')) return;
    pushHistory();

    /* 新しいシーンの隊形は、1カウント目より前で最後に始まるシーン（2曲目なら1曲目の最後のシーン）を引き継ぐ */
    var before = state.scenes.filter(function(s){ return s.startSec!=null && s.startSec < cs.markA - 0.05; });
    var baseSc = before.length ? before.reduce(function(a,b){ return b.startSec>=a.startSec ? b : a; }) : (currentScene() || state.scenes[0]);
    var made = [];
    for(var i=0;i<plan.n;i++){
      var name = plan.batch+'-'+(i+1);
      var t = cs.markA + i*plan.interval;
      if(i===0 && plan.reuseFirst){
        var first = state.scenes[0];
        first.startSec = t; first.name = name; first.countBatch = plan.batch;
        made.push(first);
        continue;
      }
      made.push({
        id:uid('sc'), name:name, countBatch:plan.batch, section:'transition', color:'#8d8698', timeLabel:'',
        startSec:t, countNotes:{},
        note:'', videoLink:'', lightingNote:'', showIncomingPath:true, useActualPath:false,
        presence: Object.assign({}, baseSc.presence),
        positions: JSON.parse(JSON.stringify(baseSc.positions)),
        groups: JSON.parse(JSON.stringify(baseSc.groups||[]))
      });
    }
    var fresh = plan.reuseFirst ? made.slice(1) : made;
    /* 時間順になるよう、1カウント目より前に始まるシーンのうち最後のものの直後へまとめて挿入する */
    var insertAt = 0;
    state.scenes.forEach(function(s, idx){ if(s.startSec!=null && s.startSec < cs.markA - 0.05) insertAt = idx + 1; });
    if(plan.reuseFirst) insertAt = 1;
    Array.prototype.splice.apply(state.scenes, [insertAt, 0].concat(fresh));
    state.currentSceneId = made[0].id;
    ui.countSplit = {open:false, bpm:null, markA:null, markEnd:null};
    markDirty(); render();
  }

  /* ---------------- stage interaction: select / marquee / drag / context menu ---------------- */
  function wireStageEvents(){
    var svg = document.querySelector('.stage-main');
    if(!svg) return;

    var mode = null;
    var dragIds = [];
    var dragStart = null;
    var origPositions = {};
    var marqueeRect = null;
    var didDrag = false;
    var longPressTimer = null;
    function clearLongPress(){ if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; } }

    function svgPoint(clientX, clientY){
      var pt = svg.createSVGPoint();
      pt.x=clientX; pt.y=clientY;
      var m = svg.getScreenCTM();
      if(!m) return {x:0,y:0};
      var p = pt.matrixTransform(m.inverse());
      return {x:p.x, y:p.y};
    }
    function snap(v){
      if(!state.stage.snapGrid) return v;
      var step = 100/(state.stage.frontCount||9);
      return Math.round(v/step)*step;
    }

    svg.addEventListener('pointerdown', function(e){
      if(e.button===2) return;
      var badgeEl = e.target.closest ? e.target.closest('.stunt-badge') : null;
      if(badgeEl){
        ui.boardPopover = { type:'stunt', gid:badgeEl.getAttribute('data-gid'), x:e.clientX, y:e.clientY };
        render();
        return;
      }
      if(ui.boardPopover){ ui.boardPopover = null; render(); return; }
      var el = e.target.closest ? e.target.closest('.koma') : null;
      didDrag = false;
      clearLongPress();
      var sc = currentScene();
      if(el){
        var id = el.getAttribute('data-member-id');
        if(e.shiftKey || ui.multiSelect){
          var i = ui.selectedIds.indexOf(id);
          if(i>=0) ui.selectedIds.splice(i,1); else ui.selectedIds.push(id);
          render();
          return;
        }
        var grp = groupContaining(sc, id);
        dragIds = grp ? grp.memberIds.slice() : [id];
        ui.selectedIds = dragIds.slice();
        mode = 'drag';
        dragStart = svgPoint(e.clientX, e.clientY);
        origPositions = {};
        dragIds.forEach(function(mid){ origPositions[mid] = { x:sc.positions[mid].x, y:sc.positions[mid].y }; });
        if(sc.useActualPath){ dragIds.forEach(function(mid){ sc.positions[mid].path = [{x:sc.positions[mid].x,y:sc.positions[mid].y}]; }); }
        try{ svg.setPointerCapture(e.pointerId); }catch(err){}
        e.preventDefault();
        if(!grp){
          var lpClientX=e.clientX, lpClientY=e.clientY;
          longPressTimer = setTimeout(function(){
            longPressTimer = null;
            if(mode==='drag' && !didDrag){
              mode = null; dragIds=[]; dragStart=null;
              ui.boardPopover = { type:'tumbleMenu', memberId:id, x:lpClientX, y:lpClientY };
              render();
            }
          }, 550);
        }
      } else {
        mode = 'marquee';
        dragStart = svgPoint(e.clientX, e.clientY);
        marqueeRect = document.createElementNS('http://www.w3.org/2000/svg','rect');
        marqueeRect.setAttribute('fill', 'var(--accent)');
        marqueeRect.setAttribute('fill-opacity','0.12');
        marqueeRect.setAttribute('stroke','var(--accent)');
        marqueeRect.setAttribute('stroke-width','1.5');
        marqueeRect.setAttribute('x', dragStart.x); marqueeRect.setAttribute('y', dragStart.y);
        marqueeRect.setAttribute('width',0); marqueeRect.setAttribute('height',0);
        svg.appendChild(marqueeRect);
        try{ svg.setPointerCapture(e.pointerId); }catch(err){}
      }
    });

    svg.addEventListener('pointermove', function(e){
      if(mode==='drag'){
        if(!didDrag){ pushHistory(); didDrag = true; clearLongPress(); }
        var sc = currentScene();
        var p = svgPoint(e.clientX, e.clientY);
        var dx = (p.x-dragStart.x)/VB_W*100, dy=(p.y-dragStart.y)/VB_H*100;
        dragIds.forEach(function(mid){
          var np = { x:clampPct(snap(origPositions[mid].x+dx)), y:clampPct(snap(origPositions[mid].y+dy)) };
          var old = sc.positions[mid];
          if(sc.useActualPath && old && old.path){ np.path = old.path.concat([{x:np.x,y:np.y}]).slice(-200); }
          sc.positions[mid] = np;
          var g2 = svg.querySelector('.koma[data-member-id="'+mid+'"]');
          if(g2) g2.setAttribute('transform','translate('+(np.x/100*VB_W)+','+(np.y/100*VB_H)+')');
        });
        markDirty();
      } else if(mode==='marquee'){
        var p2 = svgPoint(e.clientX, e.clientY);
        var x = Math.min(p2.x, dragStart.x), y = Math.min(p2.y, dragStart.y);
        var w = Math.abs(p2.x-dragStart.x), h = Math.abs(p2.y-dragStart.y);
        marqueeRect.setAttribute('x',x); marqueeRect.setAttribute('y',y);
        marqueeRect.setAttribute('width',w); marqueeRect.setAttribute('height',h);
      }
    });

    function endInteraction(){
      clearLongPress();
      if(mode==='marquee' && marqueeRect){
        var x = parseFloat(marqueeRect.getAttribute('x')), y=parseFloat(marqueeRect.getAttribute('y'));
        var w = parseFloat(marqueeRect.getAttribute('width')), h=parseFloat(marqueeRect.getAttribute('height'));
        if(w>4 || h>4){
          var sc = currentScene();
          var picked = [];
          state.members.forEach(function(m){
            if(!sc.presence[m.id] || !sc.positions[m.id]) return;
            var pos = sc.positions[m.id];
            var vx = pos.x/100*VB_W, vy = pos.y/100*VB_H;
            if(vx>=x && vx<=x+w && vy>=y && vy<=y+h) picked.push(m.id);
          });
          ui.selectedIds = picked;
        } else {
          ui.selectedIds = [];
        }
        marqueeRect.remove(); marqueeRect=null;
        render();
      } else if(mode==='drag'){
        render();
      }
      mode=null; dragIds=[]; dragStart=null;
    }
    svg.addEventListener('pointerup', endInteraction);
    svg.addEventListener('pointercancel', endInteraction);

    svg.addEventListener('contextmenu', function(e){
      e.preventDefault();
      var el = e.target.closest ? e.target.closest('.koma') : null;
      if(!el) return;
      var id = el.getAttribute('data-member-id');
      var sc = currentScene();
      var g = groupContaining(sc, id);
      ui.selectedIds = g ? g.memberIds.slice() : [id];
      render();
    });
  }

  /* ---------------- present ---------------- */
  function wirePresentEvents(){
    on('presentClose','click', stopPresent);
    on('presentRestart','click', presentRestart);
    on('presentPrev','click', function(){ presentGo(ui.presentIndex-1); });
    on('presentNext','click', function(){ presentGo(ui.presentIndex+1); });
    on('presentPlay','click', togglePresentPlay);
    onAll('.present-dots button','click', function(){ presentGo(parseInt(this.getAttribute('data-idx'),10)); });
    document.onkeydown = function(e){
      if(!ui.present) return;
      if(e.key==='Escape') stopPresent();
      else if(e.key==='ArrowRight') presentGo(ui.presentIndex+1);
      else if(e.key==='ArrowLeft') presentGo(ui.presentIndex-1);
    };
  }
  function presentGo(i){
    if(i<0 || i>=state.scenes.length) return;
    var fromIndex = ui.presentIndex;
    var shouldAnimate = (i===fromIndex+1) && !prefersReducedMotion();
    var fromScene = state.scenes[fromIndex];
    var target = state.scenes[i];
    if(hasAudioSource() && target.startSec!=null && Math.abs(playbackTime()-target.startSec)>0.5){
      playbackSeek(target.startSec);
    }
    ui.presentIndex=i; state.currentSceneId=target.id; render();
    if(shouldAnimate && fromScene) runPresentTransitionAnimation(fromScene, target);
  }
  function runPresentTransitionAnimation(fromScene, toScene){
    var svg = document.querySelector('.present-stage-wrap .stage-svg');
    if(!svg) return;
    var DURATION = 650;
    var pathByMember = {};
    Array.prototype.forEach.call(svg.querySelectorAll('.motion-path[data-member-id]'), function(el){
      pathByMember[el.getAttribute('data-member-id')] = el;
    });
    var items = [];
    Array.prototype.forEach.call(svg.querySelectorAll('.koma[data-member-id]'), function(koma){
      var id = koma.getAttribute('data-member-id');
      var fromPos = fromScene.positions[id], toPos = toScene.positions[id];
      if(!fromPos || !fromScene.presence[id] || !toPos) return;
      var fx = fromPos.x/100*VB_W, fy = fromPos.y/100*VB_H;
      var tx = toPos.x/100*VB_W, ty = toPos.y/100*VB_H;
      var finalTransform = koma.getAttribute('transform');
      var item = { koma:koma, finalTransform:finalTransform, fx:fx, fy:fy, tx:tx, ty:ty };
      var pathEl = pathByMember[id];
      var len = pathEl && pathEl.getTotalLength ? pathEl.getTotalLength() : 0;
      if(pathEl && len>0){
        item.pathEl = pathEl; item.len = len;
        item.origDasharray = pathEl.style.strokeDasharray;
        pathEl.style.transition = 'none';
        pathEl.style.strokeDasharray = len;
        pathEl.style.strokeDashoffset = len;
      }
      koma.style.transition = 'none';
      koma.setAttribute('transform','translate('+fx+','+fy+')');
      items.push(item);
    });
    if(!items.length) return;
    void svg.getBoundingClientRect();
    var start = null;
    function step(ts){
      if(start===null) start = ts;
      var f = Math.min(1, (ts-start)/DURATION);
      var e = f<0.5 ? 2*f*f : 1-Math.pow(-2*f+2,2)/2; /* easeInOutQuad, applied identically to koma position and path reveal so they never drift apart */
      items.forEach(function(it){
        if(it.pathEl){
          var pt = it.pathEl.getPointAtLength(e*it.len);
          it.koma.setAttribute('transform','translate('+pt.x+','+pt.y+')');
          it.pathEl.style.strokeDashoffset = it.len*(1-e);
        } else {
          it.koma.setAttribute('transform','translate('+(it.fx+(it.tx-it.fx)*e)+','+(it.fy+(it.ty-it.fy)*e)+')');
        }
      });
      if(f<1){ requestAnimationFrame(step); return; }
      items.forEach(function(it){
        it.koma.setAttribute('transform', it.finalTransform);
        if(it.pathEl){
          it.pathEl.style.strokeDasharray = it.origDasharray;
          it.pathEl.style.strokeDashoffset = '';
        }
      });
    }
    requestAnimationFrame(step);
  }
  function startPresentAutoAdvance(){
    ui.presentTimer = setInterval(function(){
      var ni = ui.presentIndex+1;
      if(ni>=state.scenes.length){ ui.presentPlaying=false; clearInterval(ui.presentTimer); render(); return; }
      presentGo(ni);
    }, 3500);
  }
  function togglePresentPlay(){
    if(hasAudioSource()){
      playbackTogglePlay();
      ui.presentPlaying = !playbackIsPaused();
      render();
      return;
    }
    ui.presentPlaying = !ui.presentPlaying;
    if(ui.presentPlaying){ startPresentAutoAdvance(); }
    else if(ui.presentTimer){ clearInterval(ui.presentTimer); }
    render();
  }
  function presentRestart(){
    if(ui.presentTimer){ clearInterval(ui.presentTimer); ui.presentTimer=null; }
    presentGo(0);
    if(hasAudioSource()){
      if(playbackIsPaused()) playbackTogglePlay();
      ui.presentPlaying = true;
    } else {
      ui.presentPlaying = true;
      startPresentAutoAdvance();
    }
    render();
  }
  function stopPresent(){
    if(ui.presentTimer) clearInterval(ui.presentTimer);
    if(hasAudioSource() && !playbackIsPaused()) playbackTogglePlay();
    ui.present=false; ui.presentPlaying=false; document.onkeydown=null;
    render();
  }

  /* ================= global keyboard (undo/redo) ================= */
  document.addEventListener('keydown', function(e){
    if(ui.present) return;
    var tag = document.activeElement ? document.activeElement.tagName : '';
    if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT') return;
    var mod = e.ctrlKey || e.metaKey;
    if(mod && e.key.toLowerCase()==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
    else if(mod && (e.key.toLowerCase()==='y' || (e.key.toLowerCase()==='z' && e.shiftKey))){ e.preventDefault(); redo(); }
  });

  /* ================= save ================= */
  function buildFullHtml(s){
    var json = JSON.stringify(s).replace(/<\/script/gi, '<\\/script');
    return '<!doctype html>\n<html lang="ja">\n' + HEAD_HTML + '\n<body>\n<div id="root"></div>\n' +
      '<script id="app-state" type="application/json">' + json + '<\/script>\n' + SCRIPT_HTML + '\n</body>\n</html>';
  }
  function handleSave(){
    if(ui.isReadOnly) return;
    if(hasArtifactApi){
      ui.saveStatus='saving'; render();
      window.claude.use('artifact').then(function(artifact){
        if(!artifact){ ui.saveStatus='unavailable'; render(); return; }
        state.updatedAt = new Date().toISOString();
        var html = buildFullHtml(state);
        artifact.publish(html).then(function(){
          ui.saveStatus='saved'; ui.dirty=false; render();
        }, function(err){
          if(err && (err.code==='not_writer' || err.code==='not_granted')){
            ui.isReadOnly = true; ui.saveStatus='idle'; render();
          } else if(err && err.code==='conflict'){
            ui.saveStatus='idle'; render();
          } else {
            ui.saveStatus='error'; render();
          }
        });
      }, function(){ ui.saveStatus='unavailable'; render(); });
      return;
    }
    try{
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      localStorage.setItem(LAST_CLOUD_KEY, cloudProjectId || '');
    }catch(e){}
    if(!cfDb){ ui.dirty=false; render(); return; }
    /* アカウントのプロジェクトは自動同期。ボタンからは今すぐ同期するだけ */
    if(isSharedProject()){ cloudSaveNow(); return; }
    if(!cloudProjectId){
      /* 新しいクラウドプロジェクトはログインしたアカウントのものとして作る（旧方式の作成はルールで禁止） */
      if(currentUser){ saveLocalProjectToAccount(); return; }
      ui.dirty=false; ui.saveStatus='saved'; render();
      return;
    }
    /* ここから下は旧方式（リンクを知っていれば誰でも編集可）のプロジェクトへの上書き保存 */
    state.updatedAt = new Date().toISOString();
    var payload;
    try{ payload = JSON.parse(JSON.stringify(state)); }catch(e){ payload = null; }
    if(!payload || new Blob([JSON.stringify(payload)]).size > 900000){
      ui.dirty=false; ui.saveStatus='toolarge'; render();
      return;
    }
    ui.saveStatus='saving'; render();
    var docId = cloudProjectId;
    cfDb.collection('projects').doc(docId).set({
      state: payload,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function(){
      upsertProjectListEntry(docId, state.title);
      ui.dirty=false; ui.saveStatus='saved'; render();
    }).catch(function(){
      ui.dirty=false; ui.saveStatus='error'; render();
    });
  }

  function applyLoadedState(s){
    state = s;
    if(state.hasProject===undefined) state.hasProject = !!(state.scenes && state.scenes.length);
    state.stage = state.stage || defaultStage();
    state.audio = state.audio || { dataUrl:'', name:'', sourceType:'file', youtubeUrl:'' };
    if(!state.audio.sourceType) state.audio.sourceType = state.audio.dataUrl ? 'file' : 'file';
    ensureMemberColors(state);
    if(state.audio.dataUrl) AUDIO_EL.src = state.audio.dataUrl;
  }

  /* 閲覧専用リンク（#v=<圧縮データ>）：サーバーを介さずURL自体に状態を埋め込む方式（旧方式・フォールバック用）。
     Firestoreの?p=より優先して判定する（自己完結型でネットワーク不要のため）。 */
  var viewOnlyPayload = (function(){
    var m = window.location.hash.match(/#v=(.+)/);
    if(!m) return null;
    try{
      var json = window.LZString && LZString.decompressFromEncodedURIComponent(m[1]);
      return json ? JSON.parse(json) : null;
    }catch(e){ return null; }
  })();
  /* 閲覧専用リンク（?rv=<FirestoreドキュメントID>）：現在の標準方式。viewSnapshotsコレクションは
     firestore.rulesで作成後の更新・削除を禁止しており、一度発行したリンクの内容は変わらない。 */
  var viewSnapshotId = (function(){
    var m = window.location.search.match(/[?&]rv=([a-zA-Z0-9_-]+)/);
    return m ? m[1] : null;
  })();

  if(viewOnlyPayload){
    applyLoadedState(viewOnlyPayload);
    ui.isReadOnly = true;
    ui.screen = 'editor';
    render();
  } else if(viewSnapshotId && cfDb){
    root.innerHTML = '<div style="padding:60px 20px;text-align:center;color:var(--text-muted)">読み込み中…</div>';
    cfDb.collection('viewSnapshots').doc(viewSnapshotId).get().then(function(doc){
      if(doc.exists && doc.data() && doc.data().state){
        applyLoadedState(doc.data().state);
        ui.isReadOnly = true;
        ui.screen = 'editor';
      }
      render();
    }).catch(function(){
      render();
    });
  } else if(cloudProjectId && cfDb){
    /* 招待制のプロジェクトはログイン状態で読み込む必要があるため、保存済みのログイン情報の復元を待つ */
    root.innerHTML = '<div style="padding:60px 20px;text-align:center;color:var(--text-muted)">読み込み中…</div>';
    whenAuthReady(function(){ loadCloudProject(true); });
  } else {
    if(!authResolved) root.innerHTML = '<div style="padding:60px 20px;text-align:center;color:var(--text-muted)">読み込み中…</div>';
    whenAuthReady(render);
  }
  if(migratedAudioStripped) showToast('以前のURLから引き継ぎました。音声ファイルは容量の都合で引き継げなかったため、もう一度アップロードしてください。');

  /* ホーム画面に追加してアプリとして使えるようにする（Claude Artifact内やfile://では登録しない） */
  if('serviceWorker' in navigator && !hasArtifactApi && (location.protocol==='https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>
</body>
</html>
