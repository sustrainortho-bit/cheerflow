<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CheerFlow</title>
<meta name="theme-color" content="#121017">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CheerFlow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style id="app-style">
  :root{
    --bg:#121017; --surface:#1c1823; --surface-2:#252030; --border:#37313f;
    --text:#f2eef5; --text-muted:#aa9fbc;
    --accent:#ff5c86; --accent-contrast:#1b1720;
    --accent-soft: color-mix(in srgb, #ff5c86 16%, #1c1823);
    --hue-pink:#ff5c86; --hue-blue:#5d9cf0; --hue-teal:#3fce9f; --hue-amber:#eeab52;
    --hue-violet:#a68cf0; --hue-rust:#e08a7c; --hue-grey:#9a93a8;
    --floor-bg:#1c1826; --floor-line:#372f45; --floor-center:#ff6b86;
    --danger:#ff6b81; --danger-soft: color-mix(in srgb, #ff6b81 16%, #1c1823);
    --shadow: 0 8px 28px -12px rgba(0,0,0,.55);
    --radius: 14px;
  }

  *{box-sizing:border-box;}
  html,body{height:100%; overflow:hidden; overscroll-behavior:none; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Manrope',system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Oswald',system-ui,sans-serif; text-transform:uppercase; letter-spacing:.02em; text-wrap:balance; }
  .mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  a{color:var(--accent);}
  button{ font:inherit; }
  input,select,textarea{ font:inherit; color:var(--text); }
  ::selection{ background:var(--accent); color:var(--accent-contrast); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

  #root{ min-height:100vh; height:100vh; min-height:100dvh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }

  .btn{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface);
    color:var(--text); padding:8px 14px; border-radius:9px; cursor:pointer; font-weight:700; font-size:13px;
    white-space:nowrap;
  }
  .btn:hover{ border-color:var(--accent); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .btn:disabled:hover{ border-color:var(--border); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); }
  .btn.ghost{ background:transparent; border-color:transparent; }
  .btn.danger{ color:var(--danger); }
  .btn.small{ padding:5px 10px; font-size:12px; border-radius:7px; }
  .btn.icon{ padding:6px 9px; }
  .btn.on{ background:var(--accent-soft); border-color:var(--accent); }
  .field{ display:flex; flex-direction:column; gap:3px; }
  .field label{ font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:700; }
  .field input, .field select{
    border:1px solid var(--border); background:var(--surface); padding:6px 9px; border-radius:7px; min-width:0;
  }
  .field input[type="color"]{ padding:2px; width:44px; height:32px; }
  .field input:focus, .field select:focus{ border-color:var(--accent); outline:none; }
  .empty-hint{ color:var(--text-muted); font-size:12px; line-height:1.6; }
  .divider{ height:1px; background:var(--border); border:none; margin:8px 0; }
  .toggle-line{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; color:var(--text); }
  .switch{ position:relative; width:36px; height:20px; flex:0 0 auto; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch .track{ position:absolute; inset:0; background:var(--border); border-radius:999px; cursor:pointer; transition:background .15s; }
  .switch input:checked + .track{ background:var(--accent); }
  .switch .thumb{ position:absolute; top:2px; left:2px; width:16px; height:16px; background:var(--surface); border-radius:50%; transition:left .15s; }
  .switch input:checked ~ .thumb{ left:18px; }
  .pills-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .pill{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:999px;
    padding:5px 10px 5px 7px; font-size:12px; font-weight:700; cursor:pointer; background:var(--surface); color:var(--text);
  }
  .pill .dot{ width:9px; height:9px; border-radius:50%; }
  .pill.off{ opacity:.4; }
  details.collapse > summary{ cursor:pointer; font-family:'Oswald',system-ui,sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:.02em; color:var(--text); font-weight:700; padding:2px 0; }

  /* ---------- home screen ---------- */
  .home-screen{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:40px 20px; overflow:auto; }
  .home-brand{ font-family:'Oswald'; font-weight:700; font-size:34px; letter-spacing:.03em; }
  .home-brand em{ font-style:normal; color:var(--accent); }
  .home-actions{ display:flex; gap:20px; flex-wrap:wrap; justify-content:center; max-width:640px; }
  .home-card{
    width:260px; text-align:left; border:1px solid var(--border); background:var(--surface); border-radius:var(--radius);
    padding:22px; cursor:pointer; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px;
  }
  .home-card:hover{ border-color:var(--accent); }
  .home-card:disabled{ opacity:.5; cursor:default; }
  .home-card h2{ margin:0; font-size:18px; }
  .home-card p{ margin:0; font-size:12px; color:var(--text-muted); font-family:'Manrope'; text-transform:none; letter-spacing:0; }
  .home-card.primary{ background:var(--accent-soft); border-color:var(--accent); }
  .home-tutorial-link{
    background:none; border:none; color:var(--text-muted); font-size:13px; cursor:pointer; text-decoration:underline;
    text-underline-offset:3px; padding:4px 8px;
  }
  .home-tutorial-link:hover{ color:var(--text); }
  .project-list{ display:flex; flex-direction:column; gap:8px; width:100%; margin-top:12px; }
  .project-list-row{ display:flex; align-items:stretch; gap:6px; }
  .project-list-open{
    flex:1; min-width:0; text-align:left; border:1px solid var(--border); background:var(--surface); border-radius:var(--radius);
    padding:12px 16px; cursor:pointer; display:flex; flex-direction:column; gap:3px;
  }
  .project-list-open:hover{ border-color:var(--accent); }
  .project-list-title{ font-size:14px; font-family:'Manrope'; font-weight:700; }
  .project-list-date{ font-size:11px; color:var(--text-muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .project-list-open.static{ cursor:default; }
  .project-list-open.static:hover{ border-color:var(--border); }
  .project-list-row > .btn{ align-self:center; }

  /* ---------- account / home dashboard ---------- */
  .home-login-card{
    width:min(540px,100%); border:1px solid var(--accent); background:var(--accent-soft); border-radius:var(--radius);
    padding:20px 22px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow);
  }
  .home-login-card h2{ margin:0 0 6px; font-size:18px; }
  .home-login-card p{ margin:0; font-size:13px; line-height:1.6; color:var(--text); }
  .home-login-card > .btn{ align-self:flex-start; padding:10px 18px; font-size:14px; }
  .home-local-caption{ margin:-10px 0 -14px; font-size:12px; color:var(--text-muted); }
  .dev-signin{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:11px; color:var(--text-muted); border-top:1px dashed var(--border); padding-top:10px; }
  .dev-signin input{ border:1px solid var(--border); background:var(--surface); padding:5px 8px; border-radius:7px; font-size:12px; }
  .home-dashboard{ justify-content:flex-start; align-items:stretch; gap:18px; width:100%; max-width:760px; margin:0 auto; padding:28px 20px 40px; }
  .dash-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .dash-top .home-brand{ font-size:28px; }
  .dash-account{ display:flex; align-items:center; gap:10px; }
  .dash-account-text{ display:flex; flex-direction:column; line-height:1.3; }
  .dash-account-text span{ font-size:13px; font-weight:700; }
  .dash-account-text small{ font-size:11px; color:var(--text-muted); }
  .dash-actions{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .dash-actions > .btn{ padding:10px 18px; font-size:14px; }
  .dash-section h2{ font-size:14px; margin:6px 0 0; color:var(--text-muted); }
  .dash-section .project-list{ margin-top:10px; }
  .invite-row .project-list-open{ border-color:var(--accent); }
  .role-pill{ font-size:10px; font-weight:800; padding:1px 7px; border-radius:99px; border:1px solid var(--border); color:var(--text); }
  .role-pill.role-owner{ border-color:var(--accent); color:var(--accent); }
  .role-pill.role-editor{ border-color:var(--hue-teal); color:var(--hue-teal); }
  .role-pill.role-viewer{ border-color:var(--hue-grey); color:var(--text-muted); }
  .cloud-error-msg{ max-width:480px; text-align:center; font-size:14px; line-height:1.8; margin:0; }

  .avatar{
    width:28px; height:28px; border-radius:50%; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
    background:var(--surface-2); border:2px solid var(--surface); color:var(--text); font-size:12px; font-weight:800; overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .presence-avatars{ display:inline-flex; align-items:center; }
  .presence-avatars .avatar{ margin-left:-6px; border-color:var(--hue-teal); }
  .presence-avatars .avatar:first-child{ margin-left:0; }
  .presence-more{ font-size:11px; color:var(--text-muted); margin-left:4px; }
  .account-wrap{ position:relative; }
  .account-chip{ border:none; background:none; padding:0; cursor:pointer; display:flex; }
  .account-menu{
    position:absolute; top:calc(100% + 6px); right:0; width:230px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:var(--shadow); padding:8px; display:flex; flex-direction:column; gap:2px; z-index:60;
  }
  .account-menu-name{ font-size:13px; font-weight:700; padding:4px 10px 0; }
  .account-menu-email{ font-size:11px; color:var(--text-muted); padding:0 10px 6px; border-bottom:1px solid var(--border); margin-bottom:4px; word-break:break-all; }
  .account-menu button{ text-align:left; border:none; background:transparent; padding:9px 10px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--text); }
  .account-menu button:hover{ background:var(--surface-2); }

  /* ---------- share dialog ---------- */
  .modal-box.share-box{ width:560px; gap:16px; }
  .share-head{ display:flex; align-items:center; justify-content:space-between; }
  .share-section{ display:flex; flex-direction:column; gap:8px; }
  .share-label{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:800; }
  .share-section select, .share-invite-row input, .share-link-row input{
    border:1px solid var(--border); background:var(--surface-2); padding:8px 10px; border-radius:8px; min-width:0; font-size:13px;
  }
  .share-current{ margin:0; font-size:13px; }
  .share-link-row, .share-invite-row{ display:flex; gap:6px; align-items:center; }
  .share-link-row input, .share-invite-row input{ flex:1; }
  .share-members{ display:flex; flex-direction:column; gap:4px; max-height:38vh; overflow:auto; }
  .share-member{ display:flex; align-items:center; gap:10px; padding:6px 4px; border-radius:8px; }
  .share-member.pending{ opacity:.85; }
  .share-member-text{ flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.3; }
  .share-member-text span{ font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .share-member-text small{ font-size:11px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .share-member select{ border:1px solid var(--border); background:var(--surface-2); padding:5px 6px; border-radius:7px; font-size:12px; }
  .share-role{ font-size:12px; color:var(--text-muted); }
  .share-foot{ display:flex; justify-content:flex-end; border-top:1px solid var(--border); padding-top:10px; }
  .share-points{ margin:0; padding-left:18px; font-size:13px; line-height:1.8; color:var(--text-muted); }
  a.btn{ text-decoration:none; }
  @media (max-width:560px){ .share-invite-row{ flex-wrap:wrap; } .share-invite-row input{ flex-basis:100%; } }

  .cf-toast{
    position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:300;
    background:var(--text); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:13px; font-weight:700;
    box-shadow:var(--shadow); max-width:calc(100vw - 32px); transition:opacity .4s;
  }
  .cf-toast.out{ opacity:0; }

  /* ---------- modal ---------- */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:120; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal-box{ width:420px; max-width:100%; max-height:90vh; overflow:auto; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; display:flex; flex-direction:column; gap:14px; }
  .modal-box h2{ margin:0; font-size:18px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
  .contact-pick-list{ display:flex; flex-direction:column; gap:2px; max-height:50vh; overflow:auto; border:1px solid var(--border); border-radius:9px; padding:6px; }
  .contact-pick-row{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; font-size:13px; cursor:pointer; }
  .contact-pick-row:hover{ background:var(--floor-line); }
  .toggle-btns{ display:flex; gap:6px; }
  .toggle-btns .btn{ flex:1; justify-content:center; }

  /* ---------- editor shell ---------- */
  .editor-shell{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .editor-header{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 16px; border-bottom:1px solid var(--border);
    background:var(--surface); position:relative; z-index:40;
  }
  .brand-mini{ font-family:'Oswald'; font-weight:700; font-size:16px; letter-spacing:.03em; cursor:pointer; margin-right:4px; }
  .brand-mini em{ font-style:normal; color:var(--accent); }
  .title-input{
    border:1px solid transparent; background:transparent; font-family:'Oswald'; font-weight:600;
    font-size:15px; padding:5px 8px; border-radius:8px; min-width:100px; max-width:200px; color:var(--text);
    text-transform:none; letter-spacing:0;
  }
  .title-input:hover{ border-color:var(--border); }
  .title-input:focus{ border-color:var(--accent); background:var(--surface-2); outline:none; }
  .header-spacer{ flex:1; }
  .save-status{ font-size:11px; color:var(--text-muted); white-space:nowrap; margin-right:4px; }
  .save-status.err{ color:var(--danger); }
  .export-wrap{ position:relative; }
  .export-menu{
    position:absolute; top:calc(100% + 6px); right:0; width:230px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:var(--shadow); padding:6px; display:flex; flex-direction:column; gap:2px; z-index:50;
  }
  .export-menu button{
    text-align:left; border:none; background:transparent; padding:9px 10px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--text);
  }
  .export-menu button:hover{ background:var(--surface-2); }
  .export-menu .grp-label{ font-size:10px; text-transform:uppercase; color:var(--text-muted); font-weight:700; padding:6px 10px 2px; }

  .readonly-banner{
    background:var(--accent-soft); border-bottom:1px solid var(--border); color:var(--text);
    padding:7px 16px; font-size:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  }
  .readonly-banner > span{ flex:1 1 260px; }
  .conflict-banner{ background:color-mix(in srgb, var(--hue-amber) 22%, var(--surface)); }

  .editor-body{ flex:1; min-height:0; display:grid; grid-template-columns:var(--audio-panel-w,340px) 6px 1fr; grid-template-rows:minmax(0,1fr); overflow:hidden; }
  .editor-body.with-sidebar{ grid-template-columns:var(--audio-panel-w,340px) 6px 2fr 1fr; }
  @media (max-width:1024px){
    .editor-body{ grid-template-columns:var(--audio-panel-w,min(280px,34vw)) 6px 1fr; }
    .editor-body.with-sidebar{ grid-template-columns:var(--audio-panel-w,min(280px,34vw)) 6px 2fr 1fr; }
  }
  @media (max-width:680px){
    .editor-body{ grid-template-columns:1fr; grid-auto-rows:auto; overflow:auto; }
    .editor-body.with-sidebar{ grid-template-columns:1fr; }
    .panel-resizer{ display:none; }
  }

  .panel-resizer{ cursor:col-resize; position:relative; background:transparent; touch-action:none; }
  .panel-resizer::after{ content:''; position:absolute; top:0; bottom:0; left:2px; width:2px; background:var(--border); }
  .panel-resizer:hover::after, .panel-resizer.active::after{ background:var(--accent); }

  .audio-panel{ border-right:1px solid var(--border); background:var(--surface); padding:14px; overflow:auto; display:flex; flex-direction:column; gap:14px; min-width:0; }
  .audio-panel h2{ font-size:12px; margin:0; }
  .audio-name{ font-size:12px; color:var(--text-muted); word-break:break-all; }
  .audio-time{ font-size:13px; }
  .yt-ref-box{ border:1px dashed var(--border); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px; }

  .tl-wrap{ display:flex; flex-direction:column; gap:4px; }
  .tl-toolbar{ display:flex; align-items:center; gap:6px; }
  .tl-toolbar .spacer{ flex:1; }
  .tl-scroll{ position:relative; overflow-x:auto; overflow-y:hidden; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); height:56px; }
  .tl-track{ position:relative; height:100%; min-width:100%; }
  .tl-playhead{ position:absolute; top:0; bottom:0; width:2px; background:var(--accent); pointer-events:none; }
  .tl-tooltip{
    position:absolute; top:-22px; transform:translateX(-50%); background:var(--text); color:var(--bg);
    font-size:10px; font-family:'IBM Plex Mono',monospace; padding:2px 5px; border-radius:4px;
    white-space:nowrap; pointer-events:none; z-index:2;
  }
  .tl-mark{ position:absolute; top:0; bottom:0; width:2px; pointer-events:none; }
  .tl-mark.a{ background:var(--hue-teal); }
  .tl-mark.b{ background:var(--hue-blue); }
  .tl-mark span{ position:absolute; top:2px; left:4px; font-size:10px; font-weight:700; color:var(--text); background:var(--surface); padding:0 3px; border-radius:4px; white-space:nowrap; }
  .tl-scene-mark{ position:absolute; top:0; bottom:0; width:1px; background:var(--accent); opacity:.5; pointer-events:none; }
  .tl-label{ position:absolute; bottom:2px; font-size:9px; color:var(--text-muted); font-family:'IBM Plex Mono',monospace; transform:translateX(-50%); pointer-events:none; }
  .count-split-box{ border:1px dashed var(--border); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .count-split-box .row{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .transport-row{ display:flex; gap:6px; align-items:stretch; }
  .transport-row #audioPlayBtn{ flex:1; }

  .stage-panel{ display:flex; flex-direction:column; align-items:center; min-height:0; min-width:0; padding:12px 14px; gap:10px; overflow:auto; }
  .sel-toolbar{
    display:flex; gap:6px; flex-wrap:wrap; align-items:center; background:var(--surface-2); border:1px solid var(--border);
    border-radius:10px; padding:7px 9px;
  }
  .sel-toolbar .count{ font-size:12px; color:var(--text-muted); font-weight:700; margin-right:4px; }
  .stage-frame{ position:relative; flex:0 0 auto; }
  .viewpoint-toggle{
    position:absolute; top:8px; right:8px; z-index:5; font-size:11px; font-weight:700; letter-spacing:.02em;
    padding:5px 10px; border-radius:99px; border:1px solid var(--border); background:var(--surface); color:var(--text);
    cursor:pointer; box-shadow:var(--shadow); opacity:.9;
  }
  .viewpoint-toggle:hover{ opacity:1; border-color:var(--accent); }
  .multisel-toggle{
    position:absolute; top:44px; right:8px; z-index:5; font-size:11px; font-weight:700; letter-spacing:.02em;
    padding:6px 12px; border-radius:99px; border:1px solid var(--border); background:var(--surface); color:var(--text);
    cursor:pointer; box-shadow:var(--shadow); opacity:.9;
  }
  .multisel-toggle.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); opacity:1; }
  .stage-scene-title{
    position:absolute; top:8px; left:8px; z-index:5; max-width:60%; font-size:12px; font-weight:700;

    var token = JSON.stringify({ sub:'dev-'+email.toLowerCase().replace(/[^a-z0-9]/g,''), email:email, email_verified:true, name:email.split('@')[0] });
    cfAuth.signInWithCredential(firebase.auth.GoogleAuthProvider.credential(token)).catch(function(err){ alert(authErrorMessage(err)); });
  }
  function signOutUser(){
    if(!cfAuth) return;
    if(ui.dirty && isSharedProject() && canEditCloud() && !confirm('まだ同期されていない変更があります。ログアウトしますか？')) return;
    stopPresence(true);
    cfAuth.signOut().then(function(){
      /* 共用のタブレットで次の人がメンバー限定のプロジェクトを端末の保存データから開けないよう、
         クラウドのプロジェクトの端末コピーは消す（この端末だけのプロジェクトは残す） */
      if(cloudProjectId || lastCloudIdStored()){
        clearTimeout(scheduleLocalSave._t);
        try{ localStorage.removeItem(LS_KEY); localStorage.removeItem(LAST_CLOUD_KEY); }catch(e){}
      }
      try{ history.replaceState(null, '', location.pathname); }catch(e){}
      location.reload();
    });
  }
  if(cfAuth){
    cfAuth.getRedirectResult().catch(function(err){
      if(err && err.code && err.code!=='auth/no-auth-event') alert(authErrorMessage(err));
    });
    cfAuth.onAuthStateChanged(function(user){
      var prevUid = currentUser ? currentUser.uid : null;
      currentUser = user;
      if(!authResolved){
        authResolved = true;
        var cbs = authReadyCallbacks; authReadyCallbacks = [];
        cbs.forEach(function(fn){ fn(); });
        return;
      }
      if((user ? user.uid : null)===prevUid) return;
      ui.cloudLists = null;
      if(cloudProjectId) loadCloudProject(false); else render();
    });
  }

  /* ---------- 一覧（ホーム画面） ---------- */
  function summarizeProject(id, data){
    var uid = currentUser ? currentUser.uid : '';
    var st = data.state || {};
    return {
      id: id,
      title: data.title || st.title || '無題のプロジェクト',
      role: data.ownerUid===uid ? 'owner' : (data.editorUids||[]).indexOf(uid)>=0 ? 'editor' : (data.viewerUids||[]).indexOf(uid)>=0 ? 'viewer' : '',
      inviteRole: (data.inviteEditors||[]).indexOf(myEmailLower())>=0 ? 'editor' : 'viewer',
      ownerName: data.ownerName || '',
      updatedMs: data.updatedAt && data.updatedAt.toMillis ? data.updatedAt.toMillis() : 0,
      memberCount: (data.memberUids||[]).length,
      sceneCount: (st.scenes||[]).length,
      linkRole: data.linkRole || 'none'
    };
  }
  function loadCloudLists(){
    if(!cfDb || !currentUser || ui.cloudListsLoading) return;
    ui.cloudListsLoading = true;
    var uid = currentUser.uid, email = myEmailLower();
    var col = cfDb.collection('projects');
    Promise.all([
      col.where('memberUids','array-contains', uid).get(),
      email ? col.where('inviteEmails','array-contains', email).get() : Promise.resolve(null)
    ]).then(function(res){
      var mine = res[0].docs.map(function(d){ return summarizeProject(d.id, d.data()); });
      mine.sort(function(a,b){ return b.updatedMs - a.updatedMs; });
      var invites = res[1] ? res[1].docs
        .filter(function(d){ return (d.data().memberUids||[]).indexOf(uid)<0; })
        .map(function(d){ return summarizeProject(d.id, d.data()); }) : [];
      ui.cloudLists = { mine: mine, invites: invites };
    }).catch(function(err){
      ui.cloudLists = { mine: [], invites: [], error: (err && err.code) || 'error' };
    }).then(function(){
      ui.cloudListsLoading = false;
      if(ui.screen==='home') render();
    });
  }
  function openCloudProject(id){
    window.location.href = window.location.pathname + '?p=' + encodeURIComponent(id);
  }

  /* ---------- 保存先のクラウドプロジェクトを作る・取り込む ---------- */
  function cloudPayloadOrNull(){
    var payload;
    try{ payload = JSON.parse(JSON.stringify(state)); }catch(e){ return null; }
    /* Firestoreの1ドキュメント上限(1MiB)に余裕を持たせる。アップロード音声が大きい場合に超える */
    if(new Blob([JSON.stringify(payload)]).size > 900000) return null;
    return payload;
  }
  function newOwnedDocData(payload){
    var me = myInfo(), info = {};
    info[currentUser.uid] = me;
    var now = firebase.firestore.FieldValue.serverTimestamp();
    return {
      state: payload, title: payload.title || '',
      ownerUid: currentUser.uid, ownerName: me.name, ownerEmail: me.email,
      editorUids: [], viewerUids: [], memberUids: [currentUser.uid], memberInfo: info,
      inviteEmails: [], inviteEditors: [], linkRole: 'none',
      rev: 1, createdAt: now, updatedAt: now,
      updatedBy: { uid: currentUser.uid, name: me.name }, updatedSession: SESSION_ID
    };
  }
  function adoptCloudProject(id, data){
    cloudProjectId = id;
    cloudMeta = metaFrom(data);
    cloudBaseRev = data.rev || 0;
    try{
      var url = new URL(window.location.href);
      url.searchParams.set('p', id);
      history.replaceState(null, '', url.toString());
    }catch(e){}
    /* 端末の「以前の共有リンク」一覧は旧方式のプロジェクト専用。アカウントのプロジェクトは外す */
    removeProjectListEntry(id);
    applyCloudAccess();
    attachCloudListener();
    startPresence();
  }
  /* この端末だけにあるプロジェクトを、自分のアカウントのプロジェクトとして保存する */
  function saveLocalProjectToAccount(){
    if(!cfDb || !currentUser){ signInWithGoogle(); return; }
    var payload = cloudPayloadOrNull();
    if(!payload){ ui.saveStatus='toolarge'; render(); return; }
    var ref = cfDb.collection('projects').doc();
    var data = newOwnedDocData(payload);
    ui.saveStatus='saving'; render();
    ref.set(data).then(function(){
      adoptCloudProject(ref.id, data);
      ui.dirty=false; ui.saveStatus='saved'; ui.cloudLists=null;
      render();
      showToast('アカウントに保存しました。「共有」からメンバーを招待できます。');
    }).catch(function(){ ui.saveStatus='error'; render(); });
  }
  /* 旧方式のリンク共有プロジェクトを、自分がオーナーのプロジェクトに切り替える */
  function claimLegacyProject(){
    if(!cfDb || !cloudProjectId || !cloudMeta || !cloudMeta.legacy) return;
    if(!currentUser){ signInWithGoogle(); return; }
    if(!confirm('このプロジェクトをあなたのアカウントに追加します。\n\n・あなたがオーナーになり、メンバーの招待や権限の管理ができるようになります。\n・今のリンクを持っている人は引き続き開けますが、編集するにはGoogleログインが必要になります（共有設定で変更できます）。')) return;
    var payload = cloudPayloadOrNull();
    if(!payload){ ui.saveStatus='toolarge'; render(); return; }
    var data = newOwnedDocData(payload);
    data.linkRole = 'editor';
    var id = cloudProjectId;
    cfDb.collection('projects').doc(id).set(data).then(function(){
      adoptCloudProject(id, data);
      ui.dirty=false; ui.saveStatus='saved'; ui.cloudLists=null;
      render();
      showToast('アカウントに追加しました。');
    }).catch(function(err){ alert('アカウントに追加できませんでした（'+((err && err.code) || 'エラー')+'）'); });
  }

  /* ---------- 開く・参加する ---------- */
  function loadCloudProject(isInitial){
    detachCloud();
    if(isInitial) root.innerHTML = '<div style="padding:60px 20px;text-align:center;color:var(--text-muted)">読み込み中…</div>';
    var id = cloudProjectId;
    cfDb.collection('projects').doc(id).get().then(function(doc){
      if(id!==cloudProjectId) return;
      if(!doc.exists || !doc.data() || !doc.data().state){
        resetCloudContext();
        ui.screen = 'home';
        render();
        showToast('プロジェクトが見つかりませんでした（削除された可能性があります）。');
        return;
      }
      var data = doc.data();
      if(isInitial || !ui.dirty){
        applyLoadedState(data.state);
        ui.undoStack=[]; ui.redoStack=[]; ui.dirty=false;
      }
      cloudMeta = metaFrom(data);
      cloudBaseRev = data.rev || 0;
      ui.cloudError = null;
      ui.screen = 'editor';
      if(cloudMeta.legacy) upsertProjectListEntry(id, state.title);
      applyCloudAccess();
      render();
      if(!isSharedProject()) return;
      /* 「リンクで編集可」のプロジェクトをログインして開いたら、編集者として自動で参加する
         （自分のプロジェクト一覧に出て、在席表示や共同編集の対象になる） */
      if(currentUser && cloudRole()==='' && cloudMeta.linkRole==='editor' && !isInvitedHere()){
        joinProject('link', id).then(function(){ showToast('編集者として参加しました'); }, function(){});
      }
      attachCloudListener();
      startPresence();
    }).catch(function(err){
      if(id!==cloudProjectId) return;
      ui.cloudError = (err && err.code==='permission-denied') ? 'denied' : 'network';
      ui.screen = 'cloudError';
      render();
    });
  }
  /* 招待（via='invite'）またはリンク共有（via='link'）で、自分をメンバーに加える */
  function joinProject(via, id){
    var ref = cfDb.collection('projects').doc(id);
    return cfDb.runTransaction(function(tx){
      return tx.get(ref).then(function(snap){
        var d = snap.data();
        var uid = currentUser.uid, email = myEmailLower();
        if(!d || !d.ownerUid) throw new Error('not-shared');
        if((d.memberUids||[]).indexOf(uid)>=0) return;
        var info = Object.assign({}, d.memberInfo||{});
        info[uid] = myInfo();
        var upd = { memberUids: (d.memberUids||[]).concat([uid]), memberInfo: info };
        var role;
        if(via==='invite'){
          role = (d.inviteEditors||[]).indexOf(email)>=0 ? 'editor' : 'viewer';
          upd.inviteEmails = (d.inviteEmails||[]).filter(function(e){ return e!==email; });
          upd.inviteEditors = (d.inviteEditors||[]).filter(function(e){ return e!==email; });
        } else {
          role = d.linkRole==='editor' ? 'editor' : 'viewer';
        }
        if(role==='editor') upd.editorUids = (d.editorUids||[]).concat([uid]);
        else upd.viewerUids = (d.viewerUids||[]).concat([uid]);
        tx.update(ref, upd);
      });
    }).then(function(){
      if(id===cloudProjectId){ startPresence(); requestRender(); }
    }, function(err){
      alert('参加できませんでした（'+((err && err.code) || (err && err.message) || 'エラー')+'）');
      throw err;
    });
  }

  /* ---------- 共同編集：他のメンバーの変更を受け取る ---------- */
  function attachCloudListener(){
    if(cloudUnsub || !cfDb || !isSharedProject()) return;
    var id = cloudProjectId;
    cloudUnsub = cfDb.collection('projects').doc(id).onSnapshot({ includeMetadataChanges:true }, function(doc){
      if(id!==cloudProjectId) return;
      if(!doc.exists){
        detachCloud();
        ui.cloudError = 'deleted'; ui.screen = 'cloudError';
        render();
        return;
      }
      var data = doc.data();
      cloudMeta = metaFrom(data);
      applyCloudAccess();
      if(!doc.metadata.hasPendingWrites){
        var rev = data.rev || 0;
        if(rev > cloudBaseRev){
          if(data.updatedSession===SESSION_ID){
            cloudBaseRev = rev;
          } else {
            var by = (data.updatedBy && data.updatedBy.name) || '他のメンバー';
            if(ui.dirty && canEditCloud()){
              /* 手元に未同期の変更がある間に他の人が保存した：どちらを残すか本人に選んでもらう */
              ui.syncConflict = { state: data.state, rev: rev, by: by };
            } else {
              applyRemoteState(data.state, rev);
              showToast(by + 'さんが変更しました');
            }
          }
        }
      }
      requestRender();
    }, function(err){
      cloudUnsub = null;
      if(id!==cloudProjectId) return;
      if(err && err.code==='permission-denied'){
        stopPresence(false);
        ui.cloudError = 'denied'; ui.screen = 'cloudError';
        render();
      }
    });
  }
  function applyRemoteState(remoteState, rev){
    var keepScene = state.currentSceneId;
    var keepSel = ui.selectedIds || [];
    applyLoadedState(remoteState);
    /* 表示中のシーンと選択は人ごとに違うので、手元のものを保つ */
    if(keepScene && findScene(keepScene)) state.currentSceneId = keepScene;
    var sc = currentScene();
    ui.selectedIds = sc ? keepSel.filter(function(id){ return sc.presence && sc.presence[id]; }) : [];
    cloudBaseRev = rev;
    ui.undoStack = []; ui.redoStack = [];
    ui.dirty = false; ui.syncConflict = null;
  }
  function resolveSyncConflict(useRemote){
    var c = ui.syncConflict;
    if(!c) return;
    if(useRemote){
      applyRemoteState(c.state, c.rev);
      render();
      showToast('最新の内容を読み込みました');
    } else {
      ui.syncConflict = null;
      cloudBaseRev = c.rev;
      render();
      cloudSaveNow();
    }
  }

  /* ---------- 共同編集：自分の変更を自動で保存する ---------- */
  function scheduleCloudSave(){
    if(!cfDb || !isSharedProject() || !canEditCloud()) return;
    if(cloudSaveTimer) clearTimeout(cloudSaveTimer);
    cloudSaveTimer = setTimeout(cloudSaveNow, 1500);
  }
  function cloudSaveNow(){
    if(cloudSaveTimer){ clearTimeout(cloudSaveTimer); cloudSaveTimer=null; }
    if(!cfDb || !isSharedProject() || !canEditCloud() || ui.syncConflict || !ui.dirty) return;
    if(cloudSaving){ cloudSaveTimer = setTimeout(cloudSaveNow, 800); return; }
    var payload = cloudPayloadOrNull();
    if(!payload){ ui.saveStatus='toolarge'; refreshSaveStatus(); return; }
    var seq = dirtySeq, base = cloudBaseRev, id = cloudProjectId;
    var ref = cfDb.collection('projects').doc(id);
    var remote = null;
    cloudSaving = true; ui.saveStatus='saving'; refreshSaveStatus();
    /* 保存直前にrevを確かめ、他の人の保存を上書きしないようにする（楽観的ロック） */
    cfDb.runTransaction(function(tx){
      return tx.get(ref).then(function(snap){
        var d = snap.data() || {};
        if((d.rev||0)!==base){ remote = d; return; }
        tx.update(ref, {
          state: payload, title: payload.title || '', rev: base + 1,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedBy: { uid: currentUser.uid, name: myInfo().name },
          updatedSession: SESSION_ID
        });
      });
    }).then(function(){
      cloudSaving = false;
      if(id!==cloudProjectId) return;
      if(remote){
        ui.syncConflict = { state: remote.state, rev: remote.rev||0, by: (remote.updatedBy && remote.updatedBy.name) || '他のメンバー' };
        ui.saveStatus = 'idle';
        requestRender();
        return;
      }
      if(base + 1 > cloudBaseRev) cloudBaseRev = base + 1;
      if(dirtySeq===seq) ui.dirty = false; else scheduleCloudSave();
      ui.saveStatus = 'saved';
      refreshSaveStatus();
    }).catch(function(err){
      cloudSaving = false;
      if(id!==cloudProjectId) return;
      ui.saveStatus = 'error';
      refreshSaveStatus();
      if(err && err.code==='permission-denied'){ applyCloudAccess(); requestRender(); return; }
      /* 電波が悪いときなどは少し待って再試行する */
      cloudSaveTimer = setTimeout(cloudSaveNow, 5000);
    });
  }

  /* ---------- 在席表示（誰が同じプロジェクトを開いているか） ---------- */
  function presenceCol(){ return cfDb.collection('projects').doc(cloudProjectId).collection('presence'); }
  function startPresence(){
    if(presenceTimer || !cfDb || !currentUser || !isSharedProject() || cloudRole()==='') return;
    var beat = function(){
      if(!cloudProjectId || !currentUser) return;
      var me = myInfo();
      presenceCol().doc(currentUser.uid).set({
        name: me.name, photo: me.photo, sceneId: state.currentSceneId || '',
        at: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(function(){});
    };
    beat();
    presenceTimer = setInterval(function(){ beat(); refreshPresenceUI(); }, 25000);
    presenceUnsub = presenceCol().onSnapshot(function(qs){
      var myUid = currentUser ? currentUser.uid : '';
      ui.presence = qs.docs.filter(function(d){ return d.id!==myUid; }).map(function(d){
        var x = d.data();
        return { uid:d.id, name:x.name, photo:x.photo, sceneId:x.sceneId, at: (x.at && x.at.toMillis) ? x.at.toMillis() : Date.now() };
      });
      refreshPresenceUI();
    }, function(){});
  }
  function stopPresence(removeMine){
    if(presenceTimer){ clearInterval(presenceTimer); presenceTimer=null; }
    if(presenceUnsub){ presenceUnsub(); presenceUnsub=null; }
    if(removeMine && cfDb && cloudProjectId && currentUser && isSharedProject()){
      presenceCol().doc(currentUser.uid).delete().catch(function(){});
    }
    if(ui) ui.presence = [];
  }
  window.addEventListener('pagehide', function(){ stopPresence(true); });
  function activePresence(){
    var now = Date.now();
    return (ui.presence||[]).filter(function(p){ return now - p.at < 70000; });
  }
  function renderPresenceAvatars(){
    var list = activePresence();
    if(!list.length) return '';
    return '<div class="presence-avatars">' + list.slice(0,5).map(function(p){
      var sc = findScene(p.sceneId);
      return avatarHtml(p.name, p.photo, p.name + (sc ? '（シーン'+(sceneIndex(sc.id)+1)+'を表示中）' : '') + 'が開いています');
    }).join('') + (list.length>5 ? '<span class="presence-more">+'+(list.length-5)+'</span>' : '') + '</div>';
  }
  function refreshPresenceUI(){
    var el = document.getElementById('presenceSlot');
    if(el) el.innerHTML = renderPresenceAvatars();
  }

  function detachCloud(){
    if(cloudUnsub){ cloudUnsub(); cloudUnsub=null; }
    stopPresence(false);
    if(cloudSaveTimer){ clearTimeout(cloudSaveTimer); cloudSaveTimer=null; }
    if(ui) ui.syncConflict = null;
  }
  function resetCloudContext(){
    if(cloudProjectId) stopPresence(true);
    detachCloud();
    cloudProjectId = null; cloudMeta = null; cloudBaseRev = 0;
    ui.isReadOnly = false;
    try{ history.replaceState(null, '', window.location.pathname); }catch(e){}
  }

  /* ---------- 共有設定（オーナー）・退出 ---------- */
  function updateSharing(upd, okMsg){
    return cfDb.collection('projects').doc(cloudProjectId).update(upd).then(function(){
      if(okMsg) showToast(okMsg);
    }, function(err){
      alert('共有設定を変更できませんでした（'+((err && err.code) || 'エラー')+'）');
    });
  }
  function shareInvite(email, role){
    email = String(email||'').trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ alert('メールアドレスの形式が正しくありません。'); return false; }
    if(email===myEmailLower()){ alert('自分自身は招待できません。'); return false; }
    var info = cloudMeta.memberInfo || {};
    if(Object.keys(info).some(function(uid){ return (info[uid].email||'')===email; })){ alert('この人はすでにメンバーです。'); return false; }
    var emails = (cloudMeta.inviteEmails||[]).filter(function(e){ return e!==email; }).concat([email]);
    var editors = (cloudMeta.inviteEditors||[]).filter(function(e){ return e!==email; });
    if(role==='editor') editors.push(email);
    updateSharing({ inviteEmails: emails, inviteEditors: editors }, email + ' を招待しました');
    return true;
  }
  function shareCancelInvite(email){
    updateSharing({
      inviteEmails: (cloudMeta.inviteEmails||[]).filter(function(e){ return e!==email; }),
      inviteEditors: (cloudMeta.inviteEditors||[]).filter(function(e){ return e!==email; })
    }, '招待を取り消しました');
  }
  function shareSetMemberRole(uid, role){
    var editors = (cloudMeta.editorUids||[]).filter(function(u){ return u!==uid; });
    var viewers = (cloudMeta.viewerUids||[]).filter(function(u){ return u!==uid; });
    if(role==='editor') editors.push(uid); else viewers.push(uid);
    updateSharing({ editorUids: editors, viewerUids: viewers }, '権限を変更しました');
  }
  function withoutMember(uid){
    var info = Object.assign({}, cloudMeta.memberInfo||{});
    delete info[uid];
    var notU = function(u){ return u!==uid; };
    return {
      editorUids: (cloudMeta.editorUids||[]).filter(notU),
      viewerUids: (cloudMeta.viewerUids||[]).filter(notU),
      memberUids: (cloudMeta.memberUids||[]).filter(notU),
      memberInfo: info
    };
  }
  function shareRemoveMember(uid){
    var who = ((cloudMeta.memberInfo||{})[uid] || {}).name || 'このメンバー';
    if(!confirm(who + ' をこのプロジェクトから外しますか？')) return;
    updateSharing(withoutMember(uid), who + ' を外しました');
  }
  function leaveProject(){
    if(!confirm('このプロジェクトから抜けますか？\n抜けると、もう一度招待されるまで開けなくなります（リンク共有されている場合を除く）。')) return;
    cfDb.collection('projects').doc(cloudProjectId).update(withoutMember(currentUser.uid)).then(function(){
      removeProjectListEntry(cloudProjectId);
      resetCloudContext();
      ui.shareOpen = false; ui.cloudLists = null; ui.screen = 'home';
      render();
      showToast('プロジェクトから抜けました');
    }, function(err){ alert('抜けられませんでした（'+((err && err.code) || 'エラー')+'）'); });
  }
  function deleteCloudProject(){
    if(!confirm('「'+(state.title||'無題のプロジェクト')+'」をクラウドから削除しますか？\nメンバー全員が開けなくなり、元に戻せません。\n（この端末には作業中のデータとして残ります）')) return;
    var id = cloudProjectId;
    stopPresence(true);
    cfDb.collection('projects').doc(id).delete().then(function(){
      removeProjectListEntry(id);
      resetCloudContext();
      ui.shareOpen = false; ui.cloudLists = null; ui.screen = 'home';
      render();
      showToast('プロジェクトを削除しました');
    }, function(err){ alert('削除できませんでした（'+((err && err.code) || 'エラー')+'）'); });
  }
  function inviteMailto(email, role){
    var subject = '【CheerFlow】「'+(state.title||'構成')+'」に招待しました';
    var body = 'CheerFlowの構成「'+(state.title||'')+'」に'+(ROLE_LABELS[role]||'メンバー')+'として招待しました。\n\n' +
      '下のリンクを開いて、このメールアドレス（'+email+'）のGoogleアカウントでログインすると参加できます。\n\n' + shareUrl();
    return 'mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  }

  /* ノートの書式設定（太字/下線/文字色/文字サイズ）で入力されるHTMLは、
     Firestoreの「リンクを知っていれば誰でも読み書き可」というセキュリティモデル上、
     改ざんされたデータがそのまま届く可能性がある。
     重要：パース自体にdiv.innerHTML=を使うと、<img onerror>等はDOMに挿入された瞬間
     （ツリーを検査してタグを剥がすより前）に読み込み失敗イベントが発火し、ハンドラが
     実行されてしまう。DOMParserが作るDocumentは「fully active」ではないため画像取得や

  function sanitizeRichText(html){
    var doc = new DOMParser().parseFromString('<div>'+String(html||'')+'</div>', 'text/html');
    var div = doc.body.firstChild;
    if(!div) return '';
    var allowedTags = { B:1, U:1, SPAN:1, BR:1, FONT:1 };
    var dropEntirelyTags = { SCRIPT:1, STYLE:1, IFRAME:1, OBJECT:1, EMBED:1 };
    (function walk(node){
      Array.prototype.slice.call(node.childNodes).forEach(function(child){
        if(child.nodeType===1){
          if(dropEntirelyTags[child.tagName]){
            node.removeChild(child);
            return;
          }
          if(!allowedTags[child.tagName]){
            while(child.firstChild) node.insertBefore(child.firstChild, child);
            node.removeChild(child);
            return;
          }
          var style = child.getAttribute('style') || '';
          var legacyColor = child.getAttribute('color');
          if(legacyColor && /^#?[0-9a-fA-F]{3,8}$/.test(legacyColor)){
            style += ';color:'+(legacyColor.charAt(0)==='#'?legacyColor:'#'+legacyColor);
          }
          Array.prototype.slice.call(child.attributes).forEach(function(attr){ child.removeAttribute(attr.name); });
          if(style){
            var safe = style.replace(/[^a-zA-Z0-9#: ;.,%-]/g,'').split(';').filter(function(rule){
              return /^\s*(color|font-size)\s*:/.test(rule);
            }).join(';');
            if(safe) child.setAttribute('style', safe);
          }
          walk(child);
        } else if(child.nodeType!==3){
          node.removeChild(child);
        }
      });
    })(div);

    var xs = ids.map(function(id){ return sc.positions[id].x; });
    var minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
    ids.forEach(function(id){ sc.positions[id].x = minX+maxX-sc.positions[id].x; });
    markDirty(); render();
  }
  function removeSelectionFromScene(ids, sc){
    if(!ids.length) return; pushHistory();
    ids.forEach(function(id){ sc.presence[id]=false; delete sc.positions[id]; });
    removeFromAllGroups(sc, ids);
    ui.selectedIds=[];
    markDirty(); render();
  }
  function autoArrangeAll(sc){
    var ids = state.members.filter(function(m){ return sc.presence[m.id]; }).map(function(m){ return m.id; });
    var cols = Math.ceil(Math.sqrt(ids.length*1.6));
    var rows = Math.ceil(ids.length/cols);
    ids.forEach(function(id,i){
      var r = Math.floor(i/cols), cidx = i%cols;
      var rowCount = Math.min(cols, ids.length-r*cols);
      var x = 50 + (cidx-(rowCount-1)/2)*(70/Math.max(cols,1));
      var y = 20 + r*(60/Math.max(rows-1,1));
      setPos(sc, id, x, ids.length<=1?50:y);
    });
  }
  function copyPreviousArrangement(sc){
    var idx = sceneIndex(sc.id);
    if(idx<=0) return;
    pushHistory();
    var prev = state.scenes[idx-1];
    sc.positions = JSON.parse(JSON.stringify(prev.positions));
    sc.groups = JSON.parse(JSON.stringify(prev.groups||[]));
    markDirty(); render();
  }
  function copyFormation(sc){
    ui.formationClipboard = {
      positions: JSON.parse(JSON.stringify(sc.positions)),
      groups: JSON.parse(JSON.stringify(sc.groups||[]))

  function pasteFormation(sc){

  function renderKomaSvg(t){
    var sc = t.sc, id = t.id, pos = sc.positions[id];
    var vx = pos.x/100*VB_W, vy = pos.y/100*VB_H;
    var part = partOf(id);
    var mForColor = member(id);
    var fillColor = (mForColor && mForColor.color) ? mForColor.color : 'var('+hueVar(part, PART_DEFS)+')';
    var selected = ui.selectedIds.indexOf(id)>=0;
    var g = groupContaining(sc, id);
    var badge = '';
    if(state.stage.showRoleBadges!==false && mForColor && PART_DEFS[mForColor.part]){
      var pdef = PART_DEFS[mForColor.part];
      badge = '<circle cx="17" cy="-17" r="10" style="fill:var('+pdef.hue+');stroke:var(--surface);stroke-width:2;"></circle>' +
        '<text x="17" y="-13" text-anchor="middle" font-size="10" font-weight="800" style="fill:#fff;font-family:IBM Plex Mono,monospace;pointer-events:none;">'+escapeHtml(pdef.short)+'</text>';
    }
    var scale = (state.stage.komaScale||100)/100;
    var r = 24*scale;
    var ring = selected ? '<circle r="'+(r+7)+'" fill="none" style="stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4;"></circle>' : '';
    var groupRing = (g && !selected) ? '<circle r="'+(r+4)+'" fill="none" style="stroke:var(--text-muted);stroke-width:1;stroke-dasharray:2 3;opacity:.6;"></circle>' : '';
    var nm = memberName(id);
    return '<g class="koma" data-member-id="'+id+'" data-group-id="'+(g?g.id:'')+'" transform="translate('+vx+','+vy+')">' +
      groupRing + ring +
      '<circle r="'+r+'" style="fill:'+fillColor+';stroke:var(--surface);stroke-width:2;"></circle>' +
      '<text y="4" text-anchor="middle" font-size="'+(13*scale)+'" font-weight="700" style="fill:#fff;font-family:Manrope,sans-serif;pointer-events:none;">'+escapeHtml(nm.length>3?nm.slice(0,3):nm)+'</text>' +
      badge +
      '</g>';
  }

  function renderFloorDefs(){
    var st = state.stage;
    var g = ['<rect x="0" y="0" width="'+VB_W+'" height="'+VB_H+'" style="fill:var(--floor-bg);"></rect>'];
    var cols = Math.max(1, st.frontCount||9), rows = Math.max(1, st.depthCount||6), i;
    if(st.showGrid){
      for(i=1;i<cols;i++){
        var gx = i*VB_W/cols;
        g.push('<line x1="'+gx+'" y1="0" x2="'+gx+'" y2="'+VB_H+'" style="stroke:var(--floor-line);stroke-width:1;"></line>');
      }
      for(i=1;i<rows;i++){
        var gy = i*VB_H/rows;
        g.push('<line x1="0" y1="'+gy+'" x2="'+VB_W+'" y2="'+gy+'" style="stroke:var(--floor-line);stroke-width:1;"></line>');
      }
    }
    if(st.showCenter){
      [1,2,3].forEach(function(k){
        var gx = VB_W*k/4;
        var mainLine = k===2;
        g.push('<line x1="'+gx+'" y1="0" x2="'+gx+'" y2="'+VB_H+'" style="stroke:var(--hue-teal);stroke-width:'+(mainLine?2:1.5)+';stroke-dasharray:9 6;opacity:'+(mainLine?.9:.7)+';"></line>');
      });
      [1,2,3].forEach(function(k){
        var gy = VB_H*k/4;
        var mainLine = k===2;
        g.push('<line x1="0" y1="'+gy+'" x2="'+VB_W+'" y2="'+gy+'" style="stroke:var(--hue-teal);stroke-width:'+(mainLine?2:1.5)+';stroke-dasharray:9 6;opacity:'+(mainLine?.9:.7)+';"></line>');
      });
    }
    if(st.showDiagonal){
      g.push('<line x1="0" y1="0" x2="'+VB_W+'" y2="'+VB_H+'" style="stroke:var(--hue-amber);stroke-width:1.75;stroke-dasharray:4 5;opacity:.9;"></line>');
      g.push('<line x1="'+VB_W+'" y1="0" x2="0" y2="'+VB_H+'" style="stroke:var(--hue-amber);stroke-width:1.75;stroke-dasharray:4 5;opacity:.9;"></line>');
    }
    if(st.showThirds){
      [1,2].forEach(function(k){
        g.push('<line x1="'+(VB_W*k/3)+'" y1="0" x2="'+(VB_W*k/3)+'" y2="'+VB_H+'" style="stroke:var(--hue-violet);stroke-width:1.75;stroke-dasharray:2 4;opacity:.9;"></line>');
        g.push('<line x1="0" y1="'+(VB_H*k/3)+'" x2="'+VB_W+'" y2="'+(VB_H*k/3)+'" style="stroke:var(--hue-violet);stroke-width:1.75;stroke-dasharray:2 4;opacity:.9;"></line>');
      });
    }
    if(st.showFrontNumbers){
      var flabels = (st.frontLabels||'').trim() ? (st.frontLabels||'').trim().split(/[\s,、]+/) : null;
      for(i=0;i<cols;i++){
        var cx = (i+0.5)*VB_W/cols;
        var lab = flabels && flabels[i]!==undefined ? flabels[i] : (i+1);
        g.push('<text x="'+cx+'" y="'+(VB_H-14)+'" text-anchor="middle" font-size="15" style="fill:var(--text-muted);font-family:IBM Plex Mono,monospace;">'+escapeHtml(String(lab))+'</text>');
      }
    }
    if(st.showDepthNumbers){
      var dlabels = (st.depthLabels||'').trim() ? (st.depthLabels||'').trim().split(/[\s,、]+/) : null;
      for(i=0;i<rows;i++){
        var cy = (i+0.5)*VB_H/rows;
        var dlab = dlabels && dlabels[i]!==undefined ? dlabels[i] : (i+1);
        g.push('<text x="14" y="'+(cy+5)+'" font-size="14" style="fill:var(--text-muted);font-family:IBM Plex Mono,monospace;">'+escapeHtml(String(dlab))+'</text>');
      }
    }
    g.push('<text x="18" y="30" font-size="15" font-weight="700" style="fill:var(--text-muted);font-family:Oswald,sans-serif;">下手</text>');
    g.push('<text x="'+(VB_W-18)+'" y="30" text-anchor="end" font-size="15" font-weight="700" style="fill:var(--text-muted);font-family:Oswald,sans-serif;">上手</text>');
    g.push('<text x="'+(VB_W/2)+'" y="'+(st.audienceAtTop?28:(VB_H-34))+'" text-anchor="middle" font-size="13" style="fill:var(--text-muted);font-family:Manrope,sans-serif;letter-spacing:.1em;">客席</text>');
    return g.join('');
  }
  function renderPaths(scene){
    if(!scene.showIncomingPath) return '';
    var idx = sceneIndex(scene.id);
    if(idx <= 0) return '';
    var prev = state.scenes[idx-1];
    var out = ['<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" style="fill:var(--text-muted);"></path></marker></defs>'];
    Object.keys(scene.positions).forEach(function(id){
      if(!prev.positions[id] || !prev.presence[id]) return;
      var a = prev.positions[id], b = scene.positions[id];
      var skill = b.tumbleSkill;
      var dash = skill ? '7 3 1 3' : '4 4';
      var lineColor = skill ? 'var(--hue-rust)' : 'var(--text-muted)';
      var trace = (scene.useActualPath && b.path && b.path.length>1) ? b.path : null;
      var bx = b.x/100*VB_W, by = b.y/100*VB_H;
      if(trace){
        var d = 'M ' + trace.map(function(p){ return (p.x/100*VB_W)+' '+(p.y/100*VB_H); }).join(' L ');
        out.push('<path class="motion-path" data-member-id="'+id+'" d="'+d+'" fill="none" style="stroke:'+lineColor+';stroke-width:1.5;stroke-dasharray:'+dash+';opacity:.65;" marker-end="url(#arrow)"></path>');
      } else {
        var ax=a.x/100*VB_W, ay=a.y/100*VB_H;
        /* 移動距離がほぼ0の場合はここでreturnしていたが、これだと技名ラベルの表示も
           一緒にスキップされてしまい「タンブリングを選んでも技名が出ない」不具合になっていた。
           線の描画だけをスキップし、技名ラベルは移動距離に関係なく必ず表示する。 */
        if(Math.abs(ax-bx)>=1 || Math.abs(ay-by)>=1){
          out.push('<line class="motion-path" data-member-id="'+id+'" x1="'+ax+'" y1="'+ay+'" x2="'+bx+'" y2="'+by+'" style="stroke:'+lineColor+';stroke-width:1.5;stroke-dasharray:'+dash+';opacity:.65;" marker-end="url(#arrow)"></line>');
        }
      }
      if(skill && TUMBLE_SKILLS[skill]){
        var lx = bx, ly = by - 34;
        out.push('<text x="'+lx+'" y="'+ly+'" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--hue-rust);font-family:Manrope,sans-serif;pointer-events:none;">'+escapeHtml(TUMBLE_SKILLS[skill])+'</text>');
      }
    });
    return out.join('');
  }

  function stuntGroupsOf(scene){
    return (scene.groups||[]).filter(function(g){ return g.type==='stunt' && g.memberIds.length; });
  }
  function groupBBoxVb(ids, scene){
    var xs = [], ys = [];
    ids.forEach(function(id){ var p = scene.positions[id]; if(p){ xs.push(p.x/100*VB_W); ys.push(p.y/100*VB_H); } });
    if(!xs.length) return null;
    return { x1:Math.min.apply(null,xs), x2:Math.max.apply(null,xs), y1:Math.min.apply(null,ys), y2:Math.max.apply(null,ys) };
  }
  function renderGroupOutlines(scene){
    var pad = 34;
    return stuntGroupsOf(scene).map(function(g){
      var ids = g.memberIds.filter(function(id){ return scene.positions[id]; });
      var bb = groupBBoxVb(ids, scene);
      if(!bb) return '';
      var x1=bb.x1-pad, y1=bb.y1-pad, x2=bb.x2+pad, y2=bb.y2+pad;
      return '<rect x="'+x1+'" y="'+y1+'" width="'+(x2-x1)+'" height="'+(y2-y1)+'" rx="18" fill="none" style="stroke:var(--accent);stroke-width:2.5;stroke-dasharray:7 5;opacity:.6;" pointer-events="none"></rect>';
    }).join('');
  }
  function renderStuntBadges(scene){
    var pad = 34, bw = 42, bh = 58;
    return stuntGroupsOf(scene).map(function(g){
      var ids = g.memberIds.filter(function(id){ return scene.positions[id]; });
      var bb = groupBBoxVb(ids, scene);
      if(!bb) return '';
      var t = STUNT_TYPES[g.stuntType] || STUNT_TYPES[STUNT_TYPE_ORDER[0]];
      var picto = STUNT_PICTOS[g.stuntType] || STUNT_PICTOS[STUNT_TYPE_ORDER[0]];
      var cy = (bb.y1+bb.y2)/2;
      var placeRight = (bb.x2+pad+10+bw) <= (VB_W-10);
      var bx = placeRight ? (bb.x2+pad+10) : (bb.x1-pad-10-bw);
      var by = cy - bh/2;
      return '<g class="stunt-badge" data-gid="'+g.id+'" transform="translate('+bx+','+by+')" style="cursor:pointer;">' +
        '<rect width="'+bw+'" height="'+bh+'" rx="9" style="fill:var(--surface);stroke:var(--border);stroke-width:1.2;opacity:.97;"></rect>' +
        '<g transform="translate('+(bw/2-13)+',7) scale(1.3)">'+picto+'</g>' +
        '<text x="'+(bw/2)+'" y="'+(bh-8)+'" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--text);font-family:Manrope,sans-serif;">'+escapeHtml(t.label)+'</text>' +
      '</g>';
    }).join('');
  }
  function renderStageSvg(scene, opts){
    opts = opts || {};
    var mini = !!opts.mini;
    var body = [renderFloorDefs()];
    if(!mini) body.push(renderPaths(scene));
    if(!mini) body.push(renderGroupOutlines(scene));
    var els = [];
    state.members.forEach(function(m){
      if(!scene.presence[m.id] || !scene.positions[m.id]) return;
      els.push(renderKomaSvg({ sc:scene, id:m.id }));
    });
    body.push(els.join(''));
    if(!mini) body.push(renderStuntBadges(scene));
    var cls = 'stage-svg' + (mini ? '' : ' stage-main');
    return '<svg class="'+cls+'" viewBox="0 0 '+VB_W+' '+VB_H+'" data-scene-id="'+scene.id+'">'+body.join('')+'</svg>';
  }

  function fitStageFrame(){
    var panel = document.querySelector('.stage-panel');
    var row = document.querySelector('.stage-row');
    var frame = document.querySelector('.stage-frame');
    if(!panel || !row || !frame) return;
    frame.style.width = ''; frame.style.height = '';
    var panelRect = panel.getBoundingClientRect();
    var cs = getComputedStyle(panel);
    var padV = (parseFloat(cs.paddingTop)||0) + (parseFloat(cs.paddingBottom)||0);
    var padH = (parseFloat(cs.paddingLeft)||0) + (parseFloat(cs.paddingRight)||0);
    var gap = parseFloat(cs.rowGap||cs.gap)||0;
    var siblingsH = 0, siblingCount = 0;
    Array.prototype.forEach.call(panel.children, function(ch){
      if(ch===row) return;
      siblingsH += ch.getBoundingClientRect().height;
      siblingCount++;
    });
    var availH = panelRect.height - padV - siblingsH - gap*siblingCount;
    var rowRect = row.getBoundingClientRect();
    var rowCs = getComputedStyle(row);
    var rowGap = parseFloat(rowCs.columnGap||rowCs.gap)||0;
    var rowSiblingsW = 0, rowSiblingCount = 0;
    Array.prototype.forEach.call(row.children, function(ch){
      if(ch===frame) return;
      rowSiblingsW += ch.getBoundingClientRect().width;
      rowSiblingCount++;
    });
    var availW = rowRect.width - rowSiblingsW - rowGap*rowSiblingCount;
    var w = availW, h = w*0.7;
    if(h > availH){ h = Math.max(80, availH); w = h/0.7; }
    frame.style.width = Math.max(160, w)+'px';
    frame.style.height = Math.max(112, h)+'px';
  }
  window.addEventListener('resize', function(){ fitStageFrame(); positionYtPortal(); });
  var stageResizeObserver = (typeof ResizeObserver!=='undefined') ? new ResizeObserver(function(){ fitStageFrame(); }) : null;
  function observeStagePanelResize(){

  function saveStatusText(){
    if(ui.isReadOnly) return '閲覧専用';
    if(isSharedProject()){
      if(ui.syncConflict) return '同時編集の確認待ち';
      if(ui.saveStatus==='saving') return '同期中…';
      if(ui.saveStatus==='error') return '同期できていません（自動で再試行します）';
      if(ui.saveStatus==='toolarge') return '音声ファイルが大きすぎて同期できません（YouTube推奨）';
      return ui.dirty ? '同期待ち…' : 'クラウドと同期済み';
    }
    if(hasArtifactApi){
      if(ui.saveStatus==='saving') return '保存中…';
      if(ui.saveStatus==='saved') return '保存済み・'+fmtTime(state.updatedAt);
      if(ui.saveStatus==='error') return '保存に失敗しました';
      if(ui.saveStatus==='unavailable') return '保存機能は利用できません';
      if(state.updatedAt) return (ui.dirty?'未保存の変更あり・':'最終保存 ') + fmtTime(state.updatedAt);
      return ui.dirty ? '未保存の変更があります' : '未保存';
    }
    if(cfDb){
      if(ui.saveStatus==='saving') return 'クラウドに保存中…';
      if(ui.saveStatus==='saved') return cloudProjectId ? 'クラウドに保存済み・共有リンク有効' : 'この端末に保存済み';
      if(ui.saveStatus==='error') return 'クラウド保存に失敗（この端末には保存済み）';
      if(ui.saveStatus==='toolarge') return '音声ファイルが大きすぎて共有できません（YouTube推奨・この端末には保存済み）';
      return ui.dirty ? '未保存の変更があります' : (cloudProjectId ? 'クラウドに保存済み' : 'この端末に保存済み');
    }
    return ui.dirty ? 'この端末に自動保存中…' : 'この端末に保存済み';
  }

  function createProject(opts){
    resetCloudContext();
    var n = Math.max(1, Math.min(60, opts.memberCount||8));
    var members = [];
    for(var i=1;i<=n;i++){ members.push({ id:uid('m'), name:'メンバー'+i, part:PART_ORDER[0], color:nextKomaColor(i-1) }); }
    var presence = {}; members.forEach(function(m){ presence[m.id]=true; });
    var scene1 = {
      id:uid('sc'), name:'シーン1', section:'opening', color:SECTION_DEFS.opening.color, timeLabel:'', startSec:null,
      countNotes:{}, note:'', videoLink: opts.audio && opts.audio.sourceType==='youtube' ? opts.audio.youtubeUrl : '',
      lightingNote:'', showIncomingPath:true, useActualPath:false,
      presence:presence, positions:{}, groups:[]
    };
    members.forEach(function(m){ scene1.positions[m.id] = {x:50,y:50}; });
    state = {
      hasProject:true, title:opts.title||'新しいルーティン', members:members, scenes:[scene1], currentSceneId:scene1.id,
      stage: defaultStage(), projectMemo:'',
      audio: opts.audio || { dataUrl:'', name:'', sourceType:'file', youtubeUrl:'' },
      updatedAt:null
    };
    autoArrangeAll(scene1);
    if(state.audio.dataUrl) AUDIO_EL.src = state.audio.dataUrl;
    ui.selectedIds=[]; ui.undoStack=[]; ui.redoStack=[]; ui.screen='editor';
    markDirty(); render();
    if(currentUser && cfDb) saveLocalProjectToAccount();
  }

  function wireHomeEvents(){
    on('homeTutorialBtn','click', function(){ ui.tutorial = { step:0 }; render(); });
    var editBtn = document.getElementById('homeEditBtn');
    if(editBtn) editBtn.addEventListener('click', function(){
      if(state.hasProject){
        if(confirm('作業中のプロジェクトがあります。続きから開始しますか？')){
          /* 最後に開いていたのがクラウドのプロジェクトなら、手元のコピーではなくクラウド版を開く */
          var lastId = !cloudProjectId && lastCloudIdStored();
          if(lastId){ openCloudProject(lastId); return; }
          ui.screen='editor'; render(); return;
        }
      }
      if(loadProjectList().length){ ui.screen='projectList'; render(); }
    });
    onAll('[data-act="open-local-project"]','click', function(){ resetCloudContext(); ui.screen='editor'; render(); });
    onAll('[data-act="remove-project-entry"]','click', function(e){
      e.stopPropagation();
      removeProjectListEntry(this.getAttribute('data-id'));
      render();
    });
    var newBtn = document.getElementById('homeNewBtn');
    if(newBtn) newBtn.addEventListener('click', function(){
      if(hasLocalOnlyProject() && !confirm(currentUser ?
        'この端末だけに保存されているプロジェクト「'+(state.title||'無題')+'」は、新しいプロジェクトを作ると消えます。先に「アカウントに保存」しておくことをおすすめします。\n\nこのまま新しいプロジェクトを作成しますか？' :
        '既存のプロジェクトを新しいプロジェクトで置き換えます。よろしいですか？')) return;
      ui.wizardOpen=true; ui.wizardAudioSrc='file'; ui.wizardFileStaged=null;
      ui.wizardTitle=''; ui.wizardCount=8; ui.wizardYtUrl='';
      render();
    });
    var cancel = document.getElementById('wizardCancel');
    if(cancel) cancel.addEventListener('click', function(){ ui.wizardOpen=false; render(); });
    var backdrop = document.getElementById('wizardBackdrop');
    if(backdrop) backdrop.addEventListener('click', function(e){ if(e.target===backdrop){ ui.wizardOpen=false; render(); } });
    Array.prototype.forEach.call(document.querySelectorAll('[data-wsrc]'), function(b){
      b.addEventListener('click', function(){ ui.wizardAudioSrc=this.getAttribute('data-wsrc'); render(); });
    });
    var wTitle = document.getElementById('wizardTitle');
    if(wTitle) wTitle.addEventListener('input', function(){ ui.wizardTitle = this.value; });
    var wCount = document.getElementById('wizardCount');
    if(wCount) wCount.addEventListener('input', function(){ ui.wizardCount = this.value; });
    var wYt = document.getElementById('wizardYtUrl');
    if(wYt) wYt.addEventListener('input', function(){ ui.wizardYtUrl = this.value; });
    var wFile = document.getElementById('wizardFile');
    if(wFile) wFile.addEventListener('change', function(){
      var f = this.files && this.files[0];
      if(!f) return;
      if(f.size > 8*1024*1024){ alert('音源ファイルが大きすぎます（8MB以下推奨）'); this.value=''; return; }
      var reader = new FileReader();
      reader.onload = function(){ ui.wizardFileStaged = { dataUrl:reader.result, name:f.name }; render(); };
      reader.readAsDataURL(f);
    });
    var create = document.getElementById('wizardCreate');
    if(create) create.addEventListener('click', function(){
      var title = (ui.wizardTitle||'').trim();
      if(!title){
        alert('構成名を入力してください。');
        var titleEl = document.getElementById('wizardTitle');
        if(titleEl) titleEl.focus();
        return;
      }
      var count = parseInt(ui.wizardCount,10) || 8;
      var audio;
      if(ui.wizardAudioSrc==='file'){
        audio = ui.wizardFileStaged ? { dataUrl:ui.wizardFileStaged.dataUrl, name:ui.wizardFileStaged.name, sourceType:'file', youtubeUrl:'' }
                                     : { dataUrl:'', name:'', sourceType:'file', youtubeUrl:'' };
      } else {
        var yt = (ui.wizardYtUrl||'').trim();
        audio = { dataUrl:'', name:'', sourceType:'youtube', youtubeUrl:yt };
      }
      ui.wizardOpen=false;
      createProject({ title: title, memberCount: count, audio: audio });
    });
  }

  function renderShareBody(role){
    var isOwner = role==='owner';
    var m = cloudMeta;
    var info = m.memberInfo || {};
    var out = [];
    out.push('<div class="share-section"><div class="share-label">リンク</div>' +
      (isOwner ?
        '<select id="linkRoleSelect">' + ['none','viewer','editor'].map(function(k){
          return '<option value="'+k+'" '+(m.linkRole===k?'selected':'')+'>'+LINK_ROLE_LABELS[k]+'</option>';
        }).join('') + '</select>' :
        '<p class="share-current">'+escapeHtml(LINK_ROLE_LABELS[m.linkRole||'none'])+'</p>') +
      shareLinkRow(false) +
      '<p class="empty-hint">'+(m.linkRole==='none' ? '招待したメンバーだけがこのリンクで開けます。' :
        m.linkRole==='viewer' ? 'このリンクを知っている人は誰でも閲覧できます（編集はメンバーのみ）。' :
        'このリンクを開いてGoogleログインした人は、編集者として自動でメンバーに追加されます。')+'</p></div>');
    if(isOwner){
      out.push('<div class="share-section"><div class="share-label">メンバーを招待</div>' +
        '<div class="share-invite-row">' +
          '<input type="email" id="inviteEmailInput" placeholder="招待する人のメールアドレス（Googleアカウント）" autocomplete="off">' +
          '<select id="inviteRoleSelect"><option value="editor">編集者</option><option value="viewer">閲覧者</option></select>' +
          '<button type="button" class="btn small primary" data-act="share-invite">招待</button>' +
        '</div>' +
        '<p class="empty-hint">招待した人がリンクを開き、そのメールアドレスのGoogleアカウントでログインすると参加できます。通知メールは自動では送られないので、「メールで知らせる」やLINEなどでリンクを伝えてください。</p></div>');
    }
    var uids = (m.memberUids||[]).slice().sort(function(a,b){
      if(a===m.ownerUid) return -1; if(b===m.ownerUid) return 1;
      return String((info[a]||{}).name||'').localeCompare(String((info[b]||{}).name||''), 'ja');
    });
    var rows = uids.map(function(uid){
      var p = info[uid] || {};
      var r = uid===m.ownerUid ? 'owner' : (m.editorUids||[]).indexOf(uid)>=0 ? 'editor' : 'viewer';
      var isMe = currentUser && uid===currentUser.uid;
      var roleCtl = (isOwner && r!=='owner') ?
        '<select data-act="member-role" data-uid="'+uid+'"><option value="editor" '+(r==='editor'?'selected':'')+'>編集者</option><option value="viewer" '+(r==='viewer'?'selected':'')+'>閲覧者</option></select>' +
        '<button type="button" class="btn small ghost icon" data-act="member-remove" data-uid="'+uid+'" title="メンバーから外す">✕</button>' :
        '<span class="share-role">'+ROLE_LABELS[r]+'</span>';
      return '<div class="share-member">' + avatarHtml(p.name, p.photo) +
        '<div class="share-member-text"><span>'+escapeHtml(p.name||'名前未設定')+(isMe?'（あなた）':'')+'</span><small>'+escapeHtml(p.email||'')+'</small></div>' +
        roleCtl + '</div>';
    });
    (m.inviteEmails||[]).forEach(function(email){
      var r = (m.inviteEditors||[]).indexOf(email)>=0 ? 'editor' : 'viewer';
      rows.push('<div class="share-member pending">' + avatarHtml(email) +
        '<div class="share-member-text"><span>'+escapeHtml(email)+'</span><small>招待中・'+ROLE_LABELS[r]+'</small></div>' +
        (isOwner ?
          '<a class="btn small ghost" href="'+escapeHtml(inviteMailto(email, r))+'">メールで知らせる</a>' +
          '<button type="button" class="btn small ghost icon" data-act="invite-cancel" data-email="'+escapeHtml(email)+'" title="招待を取り消す">✕</button>' : '') +
      '</div>');
    });
    out.push('<div class="share-section"><div class="share-label">メンバー（'+uids.length+'人'+((m.inviteEmails||[]).length ? '・招待中'+(m.inviteEmails||[]).length+'人' : '')+'）</div>' +
      '<div class="share-members">'+rows.join('')+'</div>' +
      '<p class="empty-hint">編集者の変更は自動で全員の画面に反映されます。同じ時間に同じプロジェクトを編集して内容がぶつかった場合は、どちらを残すか確認が出ます。</p></div>');
    out.push('<div class="share-foot">' + (isOwner ?
      '<button type="button" class="btn small danger ghost" data-act="cloud-delete">プロジェクトを削除</button>' :
      (role ? '<button type="button" class="btn small danger ghost" data-act="cloud-leave">このプロジェクトから抜ける</button>' : '')) +
    '</div>');
    return out.join('');
  }

  /* ---------------- Audio panel (left) ---------------- */
  function renderTimeline(cur, dur, leftExtra){
    dur = dur||0;
    var zoom = ui.tlZoom||60;
    var w = Math.max(1, dur) * zoom;
    var step = zoom>=150 ? 1 : zoom>=60 ? 2 : zoom>=25 ? 5 : zoom>=10 ? 15 : zoom>=3 ? 30 : 60;
    var labels = '';
    for(var t=0; t<=dur; t+=step){
      labels += '<span class="tl-label" style="left:'+(t*zoom)+'px">'+fmtAudioTime(t).replace(/\.0$/,'')+'</span>';
    }
    var gridBg = 'background-image:repeating-linear-gradient(to right, var(--border) 0, var(--border) 1px, transparent 1px, transparent '+(step*zoom)+'px);';
    var cs = ui.countSplit;
    var overlayGrid = '';
    var csInterval = (cs && cs.bpm>0) ? (60/cs.bpm*8) : null;
    if(cs && cs.markA!=null && cs.markEnd!=null && csInterval && cs.markEnd>cs.markA){
      overlayGrid = '<div style="position:absolute;top:0;bottom:0;left:'+(cs.markA*zoom)+'px;width:'+((cs.markEnd-cs.markA)*zoom)+'px;opacity:.55;'+
        'background-image:repeating-linear-gradient(to right, var(--hue-rust) 0, var(--hue-rust) 2px, transparent 2px, transparent '+(csInterval*zoom)+'px);"></div>';
    }
    var markA = (cs && cs.markA!=null) ? '<div class="tl-mark a" style="left:'+(cs.markA*zoom)+'px"><span>①</span></div>' : '';
    var markB = (cs && cs.markEnd!=null) ? '<div class="tl-mark b" style="left:'+(cs.markEnd*zoom)+'px"><span>②</span></div>' : '';
    var sceneMarks = state.scenes.map(function(s){
      if(s.startSec==null) return '';
      return '<div class="tl-scene-mark" style="left:'+(s.startSec*zoom)+'px" title="'+escapeHtml(s.name||'')+'"></div>';
    }).join('');
    return '<div class="tl-wrap">' +
      '<div class="tl-toolbar">' +
        (leftExtra||'') +
        '<button class="btn small ghost icon" id="tlZoomOut" type="button" title="縮小">－</button>' +
        '<button class="btn small ghost icon" id="tlZoomIn" type="button" title="拡大">＋</button>' +
        '<button class="btn small ghost" id="tlToPlayhead" type="button">現在位置へ</button>' +
        '<span class="spacer"></span>' +
        '<span class="audio-time mono" id="audioTimeLabel">'+fmtAudioTime(cur)+' / '+fmtAudioTime(dur)+'</span>' +
      '</div>' +
      '<div class="tl-scroll" id="tlScroll">' +
        '<div class="tl-track" id="tlTrack" style="width:'+w+'px;'+gridBg+'">' +
          overlayGrid + labels + sceneMarks + markA + markB +
          '<div class="tl-playhead" id="tlPlayhead" style="left:'+(cur*zoom)+'px"></div>' +
          '<div class="tl-tooltip" id="tlTooltip" style="left:'+(cur*zoom)+'px;display:none;"></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function renderCountSplitBox(dur){
    var cs = ui.countSplit || (ui.countSplit = {open:false, bpm:null, markA:null, markEnd:null});
    if(!cs.open){
      return '<button class="btn small ghost" id="countSplitOpenBtn" type="button">8カウントで区切る…</button>';
    }

      } else {

    }
    return '<div class="count-split-box">' +
      '<p class="empty-hint">曲のBPMを入力し、タイムライン上で「1カウント目」と「終点」の位置を再生して合わせてマークしてください。その間を8カウント間隔で均等に区切ります。2曲をつなげた音源なら、1曲目を生成したあと2曲目のBPM・位置でもう一度生成してください（1曲目のシーンは残ります）。</p>' +
      '<div class="field"><label for="countSplitBpm">BPM</label><input type="number" id="countSplitBpm" min="40" max="240" step="0.1" value="'+(cs.bpm||'')+'" placeholder="例: 128"></div>' +
      '<div class="row">' +
        '<button class="btn small" id="markABtn" type="button">1カウント目にマーク'+(cs.markA!=null?'（'+fmtAudioTime(cs.markA)+'）':'')+'</button>' +
      '</div>' +
      '<div class="row">' +
        '<button class="btn small" id="markEndBtn" type="button">終点にマーク'+(cs.markEnd!=null?'（'+fmtAudioTime(cs.markEnd)+'）':'')+'</button>' +
      '</div>' +
      info +
      '<div class="row">' +
        '<button class="btn small primary" id="generateCountScenesBtn" type="button" '+(canGen?'':'disabled')+'>この範囲でシーンを生成</button>' +
        '<button class="btn small ghost" id="countSplitCloseBtn" type="button">閉じる</button>' +
      '</div>' +
    '</div>';
  }

          '<h2>音源（YouTube）</h2>' +
          '<div class="yt-ref-box">' +
            '<p class="empty-hint">この表示環境ではYouTubeの埋め込みがブロックされているため、同期再生ができません（Claude Artifact内など）。自己ホスティングした環境では埋め込み再生が有効になります。それまでは参考リンクとして開いてください。</p>' +
            '<p class="audio-name">'+escapeHtml(state.audio.youtubeUrl||'')+'</p>' +
            '<button class="btn small" id="openYtBtn">▶ YouTubeで開く</button>' +
          '</div>' +
          '<button class="btn small ghost" id="ytChangeBtn">動画を変更</button>' +
          '<button class="btn small ghost" id="switchToFileBtn">ファイル音源に切り替える</button>' +
        '</div>';

      return '<div class="audio-panel">' +
        '<h2>音源（YouTube）</h2>' +
