<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CheerFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style id="app-style">
  :root{
    --bg:#121017; --surface:#1c1823; --surface-2:#252030; --border:#37313f;
    --text:#f2eef5; --text-muted:#aa9fbc;
    --accent:#ff5c86; --accent-contrast:#1b1720;
    --accent-soft: color-mix(in srgb, #ff5c86 16%, #1c1823);
    --hue-pink:#ff5c86; --hue-blue:#5d9cf0; --hue-teal:#3fce9f; --hue-amber:#eeab52;
    --hue-violet:#a68cf0; --hue-rust:#e08a7c; --hue-grey:#9a93a8;
    --floor-bg:#1c1826; --floor-line:#372f45; --floor-center:#ff6b86;
    --danger:#ff6b81; --danger-soft: color-mix(in srgb, #ff6b81 16%, #1c1823);
    --shadow: 0 8px 28px -12px rgba(0,0,0,.55);
    --radius: 14px;
  }

  *{box-sizing:border-box;}
  html,body{height:100%; overflow:hidden; overscroll-behavior:none; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Manrope',system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Oswald',system-ui,sans-serif; text-transform:uppercase; letter-spacing:.02em; text-wrap:balance; }
  .mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  a{color:var(--accent);}
  button{ font:inherit; }
  input,select,textarea{ font:inherit; color:var(--text); }
  ::selection{ background:var(--accent); color:var(--accent-contrast); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

  #root{ min-height:100vh; height:100vh; min-height:100dvh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }

  .btn{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface);
    color:var(--text); padding:8px 14px; border-radius:9px; cursor:pointer; font-weight:700; font-size:13px;
    white-space:nowrap;
  }
  .btn:hover{ border-color:var(--accent); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .btn:disabled:hover{ border-color:var(--border); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); }
  .btn.ghost{ background:transparent; border-color:transparent; }
  .btn.danger{ color:var(--danger); }
  .btn.small{ padding:5px 10px; font-size:12px; border-radius:7px; }
  .btn.icon{ padding:6px 9px; }
  .btn.on{ background:var(--accent-soft); border-color:var(--accent); }
  .field{ display:flex; flex-direction:column; gap:3px; }
  .field label{ font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:700; }
  .field input, .field select{
    border:1px solid var(--border); background:var(--surface); padding:6px 9px; border-radius:7px; min-width:0;
  }
  .field input[type="color"]{ padding:2px; width:44px; height:32px; }
  .field input:focus, .field select:focus{ border-color:var(--accent); outline:none; }
  .empty-hint{ color:var(--text-muted); font-size:12px; line-height:1.6; }
  .divider{ height:1px; background:var(--border); border:none; margin:8px 0; }
  .toggle-line{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; color:var(--text); }
  .switch{ position:relative; width:36px; height:20px; flex:0 0 auto; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch .track{ position:absolute; inset:0; background:var(--border); border-radius:999px; cursor:pointer; transition:background .15s; }
  .switch input:checked + .track{ background:var(--accent); }
  .switch .thumb{ position:absolute; top:2px; left:2px; width:16px; height:16px; background:var(--surface); border-radius:50%; transition:left .15s; }
  .switch input:checked ~ .thumb{ left:18px; }
  .pills-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .pill{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:999px;
    padding:5px 10px 5px 7px; font-size:12px; font-weight:700; cursor:pointer; background:var(--surface); color:var(--text);
  }
  .pill .dot{ width:9px; height:9px; border-radius:50%; }
  .pill.off{ opacity:.4; }
  details.collapse > summary{ cursor:pointer; font-family:'Oswald',system-ui,sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:.02em; color:var(--text); font-weight:700; padding:2px 0; }

  /* ---------- home screen ---------- */
  .home-screen{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:40px 20px; overflow:auto; }
  .home-brand{ font-family:'Oswald'; font-weight:700; font-size:34px; letter-spacing:.03em; }
  .home-brand em{ font-style:normal; color:var(--accent); }
  .home-actions{ display:flex; gap:20px; flex-wrap:wrap; justify-content:center; max-width:640px; }
  .home-card{
    width:260px; text-align:left; border:1px solid var(--border); background:var(--surface); border-radius:var(--radius);
    padding:22px; cursor:pointer; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px;
  }
  .home-card:hover{ border-color:var(--accent); }
  .home-card:disabled{ opacity:.5; cursor:default; }
  .home-card h2{ margin:0; font-size:18px; }
  .home-card p{ margin:0; font-size:12px; color:var(--text-muted); font-family:'Manrope'; text-transform:none; letter-spacing:0; }
  .home-card.primary{ background:var(--accent-soft); border-color:var(--accent); }

  /* ---------- modal ---------- */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:120; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal-box{ width:420px; max-width:100%; max-height:90vh; overflow:auto; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; display:flex; flex-direction:column; gap:14px; }
  .modal-box h2{ margin:0; font-size:18px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
  .toggle-btns{ display:flex; gap:6px; }
  .toggle-btns .btn{ flex:1; justify-content:center; }

  /* ---------- editor shell ---------- */
  .editor-shell{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .editor-header{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 16px; border-bottom:1px solid var(--border);
    background:var(--surface); position:relative; z-index:40;
  }
  .brand-mini{ font-family:'Oswald'; font-weight:700; font-size:16px; letter-spacing:.03em; cursor:pointer; margin-right:4px; }
  .brand-mini em{ font-style:normal; color:var(--accent); }
  .title-input{
    border:1px solid transparent; background:transparent; font-family:'Oswald'; font-weight:600;
    font-size:15px; padding:5px 8px; border-radius:8px; min-width:100px; max-width:200px; color:var(--text);
    text-transform:none; letter-spacing:0;
  }
  .title-input:hover{ border-color:var(--border); }
  .title-input:focus{ border-color:var(--accent); background:var(--surface-2); outline:none; }
  .header-spacer{ flex:1; }
  .save-status{ font-size:11px; color:var(--text-muted); white-space:nowrap; margin-right:4px; }
  .save-status.err{ color:var(--danger); }
  .export-wrap{ position:relative; }
  .export-menu{
    position:absolute; top:calc(100% + 6px); right:0; width:230px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:var(--shadow); padding:6px; display:flex; flex-direction:column; gap:2px; z-index:50;
  }
  .export-menu button{
    text-align:left; border:none; background:transparent; padding:9px 10px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--text);
  }
  .export-menu button:hover{ background:var(--surface-2); }
  .export-menu .grp-label{ font-size:10px; text-transform:uppercase; color:var(--text-muted); font-weight:700; padding:6px 10px 2px; }

  .readonly-banner{
    background:var(--accent-soft); border-bottom:1px solid var(--border); color:var(--text);
    padding:7px 16px; font-size:12px; display:flex; gap:8px; align-items:center;
  }

  .editor-body{ flex:1; min-height:0; display:grid; grid-template-columns:var(--audio-panel-w,340px) 6px 1fr; grid-template-rows:minmax(0,1fr); overflow:hidden; }
  .editor-body.with-sidebar{ grid-template-columns:var(--audio-panel-w,340px) 6px 2fr 1fr; }
  @media (max-width:1024px){
    .editor-body{ grid-template-columns:var(--audio-panel-w,min(280px,34vw)) 6px 1fr; }
    .editor-body.with-sidebar{ grid-template-columns:var(--audio-panel-w,min(280px,34vw)) 6px 2fr 1fr; }
  }
  @media (max-width:680px){
    .editor-body{ grid-template-columns:1fr; grid-auto-rows:auto; overflow:auto; }
    .editor-body.with-sidebar{ grid-template-columns:1fr; }
    .panel-resizer{ display:none; }
  }

  .panel-resizer{ cursor:col-resize; position:relative; background:transparent; touch-action:none; }
  .panel-resizer::after{ content:''; position:absolute; top:0; bottom:0; left:2px; width:2px; background:var(--border); }
  .panel-resizer:hover::after, .panel-resizer.active::after{ background:var(--accent); }

  .audio-panel{ border-right:1px solid var(--border); background:var(--surface); padding:14px; overflow:auto; display:flex; flex-direction:column; gap:14px; min-width:0; }
  .audio-panel h2{ font-size:12px; margin:0; }
  .audio-name{ font-size:12px; color:var(--text-muted); word-break:break-all; }
  .audio-time{ font-size:13px; }
  .yt-ref-box{ border:1px dashed var(--border); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px; }

  .tl-wrap{ display:flex; flex-direction:column; gap:4px; }
  .tl-toolbar{ display:flex; align-items:center; gap:6px; }
  .tl-toolbar .spacer{ flex:1; }
  .tl-scroll{ position:relative; overflow-x:auto; overflow-y:hidden; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); height:56px; }
  .tl-track{ position:relative; height:100%; min-width:100%; }
  .tl-playhead{ position:absolute; top:0; bottom:0; width:2px; background:var(--accent); pointer-events:none; }
  .tl-tooltip{
    position:absolute; top:-22px; transform:translateX(-50%); background:var(--text); color:var(--bg);
    font-size:10px; font-family:'IBM Plex Mono',monospace; padding:2px 5px; border-radius:4px;
    white-space:nowrap; pointer-events:none; z-index:2;
  }
  .tl-mark{ position:absolute; top:0; bottom:0; width:2px; pointer-events:none; }
  .tl-mark.a{ background:var(--hue-teal); }
  .tl-mark.b{ background:var(--hue-blue); }
  .tl-mark span{ position:absolute; top:2px; left:4px; font-size:10px; font-weight:700; color:var(--text); background:var(--surface); padding:0 3px; border-radius:4px; white-space:nowrap; }
  .tl-scene-mark{ position:absolute; top:0; bottom:0; width:1px; background:var(--accent); opacity:.5; pointer-events:none; }
  .tl-label{ position:absolute; bottom:2px; font-size:9px; color:var(--text-muted); font-family:'IBM Plex Mono',monospace; transform:translateX(-50%); pointer-events:none; }
  .count-split-box{ border:1px dashed var(--border); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .count-split-box .row{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .transport-row{ display:flex; gap:6px; align-items:stretch; }
  .transport-row #audioPlayBtn{ flex:1; }

  .stage-panel{ display:flex; flex-direction:column; align-items:center; min-height:0; min-width:0; padding:12px 14px; gap:10px; overflow:auto; }
  .sel-toolbar{
    display:flex; gap:6px; flex-wrap:wrap; align-items:center; background:var(--surface-2); border:1px solid var(--border);
    border-radius:10px; padding:7px 9px;
  }
  .sel-toolbar .count{ font-size:12px; color:var(--text-muted); font-weight:700; margin-right:4px; }
  .stage-frame{ position:relative; flex:0 0 auto; }
  .stage-row{ display:flex; flex:1 1 auto; flex-direction:row; gap:12px; align-items:flex-start; justify-content:center; width:100%; min-height:0; }
  .count-notes-side{ display:flex; flex-direction:column; gap:6px; width:150px; flex:0 0 150px; max-height:100%; overflow:auto; }
  .count-notes-side h3{ font-size:11px; margin:0; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; font-family:'Oswald',system-ui,sans-serif; }
  .scene-memo-inline{
    width:100%; max-width:900px; min-height:44px; border:1px solid var(--border); background:var(--surface);
    border-radius:9px; padding:8px 10px; font-size:12px; resize:vertical; flex:0 0 auto;
  }
  .stage-svg{ width:100%; height:auto; aspect-ratio:10/7; display:block; background:var(--floor-bg); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .koma{ cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .koma:active{ cursor:grabbing; }

  .side-panel{ border-left:1px solid var(--border); background:var(--surface); display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden; }
  .side-tabs{ display:flex; border-bottom:1px solid var(--border); }
  .side-tab-btn{
    flex:1; border:none; background:transparent; padding:10px 4px; font-family:'Oswald'; font-weight:700; font-size:11px;
    letter-spacing:.03em; text-transform:uppercase; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent;
  }
  .side-tab-btn[aria-selected="true"]{ color:var(--text); border-bottom-color:var(--accent); }
  .side-body{ flex:1; overflow:auto; padding:14px; display:flex; flex-direction:column; gap:12px; }
  .preset-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .align-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .headcount-row{ display:flex; align-items:center; gap:8px; }
  .headcount-row .num{ font-family:'IBM Plex Mono'; font-weight:700; min-width:26px; text-align:center; }
  .range-row{ display:flex; align-items:center; gap:8px; }
  .range-row input[type="range"]{ flex:1; }
  .count-notes-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .count-note-cell{ display:flex; align-items:center; gap:5px; border:1px solid var(--border); border-radius:7px; padding:4px 6px; background:var(--surface); }
  .count-note-cell span{ font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--text-muted); font-size:11px; width:12px; }
  .count-note-cell input{ border:none; background:transparent; padding:2px; font-size:12px; width:100%; }
  .count-note-cell input:focus{ outline:none; }
  .roster-row{ display:flex; gap:4px; align-items:center; }
  .roster-row input{ flex:1 1 0; min-width:0; border:1px solid var(--border); background:var(--surface); padding:6px 5px; border-radius:7px; font-size:12px; }
  .roster-row input[type="color"]{ flex:0 0 26px; width:26px; height:26px; padding:2px; }
  .roster-row select{ flex:0 0 64px; min-width:0; width:64px; border:1px solid var(--border); background:var(--surface); padding:5px 2px; border-radius:7px; font-size:11px; }
  .roster-row .btn{ flex:0 0 auto; padding:6px 8px; }
  .stunt-list-row{ border:1px solid var(--border); border-radius:8px; padding:8px; display:flex; flex-direction:column; gap:6px; }
  .stunt-list-row.active{ border-color:var(--accent); }
  .stunt-list-head{ display:flex; align-items:center; justify-content:space-between; }
  .stunt-list-head strong{ font-size:12px; }
  .stunt-picto-picker{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
  .stunt-picto-btn{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px;
    border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:5px 6px; cursor:pointer; min-width:50px;
  }
  .stunt-picto-btn.active{ border-color:var(--accent); background:var(--accent-soft); }
  .stunt-picto-btn span{ font-size:9px; font-weight:700; color:var(--text-muted); white-space:nowrap; }
  .stunt-picto-btn.active span{ color:var(--text); }
  .stunt-picto-btn svg{ display:block; }
  .stunt-picto-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .board-popover{ position:fixed; z-index:40; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); padding:8px; max-width:min(280px,90vw); }
  .board-popover-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; font-size:11px; font-weight:700; color:var(--text-muted); }
  .board-popover-head button{ border:none; background:transparent; cursor:pointer; color:var(--text-muted); font-size:14px; line-height:1; padding:2px; }
  .board-popover .stunt-picto-picker{ max-width:260px; }

  /* ---------- footer scene strip ---------- */
  .footer-strip{
    border-top:1px solid var(--border); background:var(--surface); padding:8px 10px; display:flex; gap:8px;
    overflow-x:auto; align-items:stretch; flex:0 0 auto;
  }
  .thumb-card{
    flex:0 0 140px; border:2px solid var(--border); border-radius:10px; overflow:hidden; cursor:pointer; position:relative;
    background:var(--surface); display:flex; flex-direction:column;
  }
  .thumb-card.active{ border-color:var(--accent); }
  .thumb-card.playing{ box-shadow:0 0 0 2px var(--hue-teal) inset; }
  .thumb-card.playing::after{ content:'▶'; position:absolute; top:2px; left:2px; font-size:10px; color:var(--hue-teal); background:var(--surface); border-radius:4px; padding:0 3px; }
  .thumb-card .strip{ height:4px; }
  .thumb-card .mini{ width:100%; aspect-ratio:10/7; background:var(--floor-bg); }
  .thumb-card .label{ font-size:10px; padding:3px 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; }
  .thumb-card .ctrls{ position:absolute; top:2px; right:2px; display:flex; gap:2px; }
  .thumb-card .ctrls button{
    width:18px; height:18px; border:none; border-radius:4px; background:rgba(0,0,0,.55); color:#fff; font-size:10px;
    cursor:pointer; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .thumb-add{
    flex:0 0 70px; border:2px dashed var(--border); border-radius:10px; background:transparent; cursor:pointer;
    color:var(--text-muted); font-weight:700; font-size:20px;
  }

  /* ---------- stunt drawer ---------- */

  /* ---------- present overlay ---------- */
  .present-overlay{
    position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; flex-direction:column; padding:20px 26px 26px;
  }
  .present-top{ display:flex; align-items:center; gap:12px; }
  .present-stage-wrap{ flex:1; display:flex; align-items:center; justify-content:center; min-height:0; padding:10px 0; }
  .present-stage-wrap .stage-svg{ max-width:min(94vw,980px); max-height:52vh; }
  .present-info{ text-align:center; display:flex; flex-direction:column; gap:4px; }
  .present-info h2{ font-size:24px; margin:0; }
  .present-controls{ display:flex; align-items:center; justify-content:center; gap:14px; padding-top:6px; }
  .present-dots{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; padding-top:8px; }
  .present-dots button{ width:9px; height:9px; padding:0; border-radius:50%; border:none; background:var(--border); cursor:pointer; }
  .present-dots button.on{ background:var(--accent); }
  .present-note{ color:var(--text-muted); font-size:13px; max-width:560px; margin:0 auto; }
  .present-countnotes{ display:flex; flex-wrap:wrap; gap:6px 14px; justify-content:center; max-width:560px; margin:6px auto 0; font-size:12px; color:var(--text-muted); }
  .present-countnotes b{ color:var(--text); font-family:'IBM Plex Mono'; margin-right:4px; }

  /* ---------- print ---------- */
  #printArea{ display:none; }
  @media print{
    @page{ size:A4 portrait; margin:8mm; }
    body > *:not(#printArea){ display:none !important; }
    #printArea{ display:block !important; }
    .print-page{
      display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(4,1fr); gap:6mm;
      width:100%; height:277mm; page-break-after:always; overflow:hidden;
    }
    .print-cell{ border:1px solid #ccc; padding:3mm; display:flex; flex-direction:column; gap:2mm; overflow:hidden; min-height:0; }
    .print-cell h3{ font-size:10px; margin:0; color:#111; flex:0 0 auto; }
    .print-cell .stage-svg{ width:100%; height:auto; max-height:34mm; flex:0 0 auto; }
    .print-cell .print-memo{ font-size:8.5px; color:#333; flex:0 0 auto; }
    .print-cell .print-countnotes{ font-size:7.5px; color:#555; display:grid; grid-template-columns:1fr 1fr; gap:1mm; flex:1 1 auto; overflow:hidden; }
  }

  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="root"></div>
<script id="app-state" type="application/json">{}</script>
<script id="app-script">
(function(){

  function ensureYtApi(cb){
    if(ytApiReady){ cb(true); return; }

    ytApiLoading = true;
    window.onYouTubeIframeAPIReady = function(){
      ytApiReady = true;
      ytPendingCbs.forEach(function(f){ f(true); }); ytPendingCbs = [];
    };
    var tag = document.createElement('script');

    };
    document.head.appendChild(tag);
    setTimeout(function(){

        ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);

  function groupContaining(sc, memberId){
    return (sc.groups||[]).filter(function(g){ return g.memberIds.indexOf(memberId)>=0; })[0] || null;

  function field(label,type,id,val,ph){

  /* ================= history (undo/redo) ================= */
  function snapshot(){ return JSON.stringify(state); }
  function pushHistory(){
    ui.undoStack.push(snapshot());
    if(ui.undoStack.length>MAX_HISTORY) ui.undoStack.shift();
    ui.redoStack.length = 0;
  }
  function undo(){
    if(!ui.undoStack.length) return;
    ui.redoStack.push(snapshot());
    var prev = ui.undoStack.pop();
    state = JSON.parse(prev);
    ui.selectedIds=[]; markDirty(); render();
  }
  function redo(){
    if(!ui.redoStack.length) return;
    ui.undoStack.push(snapshot());
    var next = ui.redoStack.pop();
    state = JSON.parse(next);
    ui.selectedIds=[]; markDirty(); render();
  }

  /* ================= arrangement / grouping logic ================= */
  function centroidOf(ids, sc){
    var sx=0, sy=0, n=0;
    ids.forEach(function(id){ var p=sc.positions[id]; if(p){ sx+=p.x; sy+=p.y; n++; } });
    return n ? {x:sx/n, y:sy/n} : {x:50,y:50};
  }
  function removeFromAllGroups(sc, ids){
    sc.groups = (sc.groups||[]).map(function(g){
      g.memberIds = g.memberIds.filter(function(id){ return ids.indexOf(id)<0; });
      return g;
    }).filter(function(g){ return g.memberIds.length>0; });
  }
  function setPos(sc,id,x,y){ sc.positions[id] = { x:clampPct(x), y:clampPct(y) }; }

  function arrangeRow(ids, sc){
    if(ids.length<2) return;
    pushHistory();
    removeFromAllGroups(sc, ids);
    var c = centroidOf(ids, sc);
    var spacing = Math.min(9, 64/Math.max(1,ids.length-1));
    var start = c.x - spacing*(ids.length-1)/2;
    ids.forEach(function(id,i){ setPos(sc,id, start+i*spacing, c.y); });
    markDirty(); render();
  }
  function arrangeColumn(ids, sc){
    if(ids.length<2) return;
    pushHistory();
    removeFromAllGroups(sc, ids);
    var c = centroidOf(ids, sc);
    var spacing = Math.min(9, 60/Math.max(1,ids.length-1));
    var start = c.y - spacing*(ids.length-1)/2;
    ids.forEach(function(id,i){ setPos(sc,id, c.x, start+i*spacing); });
    markDirty(); render();
  }
  function arrangeVShape(ids, sc){
    if(ids.length<2) return;
    pushHistory(); removeFromAllGroups(sc, ids);
    var c = centroidOf(ids, sc);
    var n = ids.length, half = Math.ceil(n/2);
    ids.forEach(function(id,i){
      var side = i%2===0 ? -1 : 1;
      var depth = Math.floor(i/2)+1;
      setPos(sc, id, c.x + side*depth*8, c.y - depth*6 + 18);
    });
    markDirty(); render();
  }
  function arrangeArc(ids, sc){
    if(ids.length<2) return;
    pushHistory(); removeFromAllGroups(sc, ids);
    var c = centroidOf(ids, sc);
    var n = ids.length, radius = 22;
    ids.forEach(function(id,i){
      var angle = Math.PI * (0.15 + 0.7*i/Math.max(1,n-1));
      setPos(sc, id, c.x + Math.cos(Math.PI-angle)*radius, c.y + 14 - Math.sin(angle)*radius*0.6);
    });
    markDirty(); render();
  }
  function arrangeBlock(ids, sc){
    if(ids.length<2) return;
    pushHistory(); removeFromAllGroups(sc, ids);
    var c = centroidOf(ids, sc);
    var cols = Math.ceil(Math.sqrt(ids.length));
    ids.forEach(function(id,i){
      var r = Math.floor(i/cols), col = i%cols;
      setPos(sc, id, c.x + (col-(cols-1)/2)*9, c.y + (r-1)*9);
    });
    markDirty(); render();
  }
  function arrangeStunt(ids, sc, stuntType){
    if(ids.length<2) return;
    pushHistory();
    removeFromAllGroups(sc, ids);
    var group = { id:uid('grp'), type:'stunt', stuntType: stuntType||STUNT_TYPE_ORDER[0], memberIds:ids.slice() };
    sc.groups = sc.groups||[];
    sc.groups.push(group);
    ui.selectedIds = ids.slice();
    markDirty(); render();
  }
  function changeStuntType(g, sc, newType){
    if(!g || !newType) return;
    pushHistory();
    g.stuntType = newType;
    markDirty(); render();
  }
  function toggleGroup(ids, sc){
    if(ids.length<2) return;
    pushHistory();
    var sorted = ids.slice().sort().join(',');
    var existing = (sc.groups||[]).filter(function(g){ return g.memberIds.slice().sort().join(',')===sorted; })[0];
    if(existing){
      sc.groups = sc.groups.filter(function(g){ return g.id!==existing.id; });
    } else {
      removeFromAllGroups(sc, ids);
      sc.groups = sc.groups||[];
      sc.groups.push({ id:uid('grp'), type:'plain', memberIds:ids.slice() });
    }
    markDirty(); render();
  }
  function alignCenterX(ids, sc){
    if(!ids.length) return; pushHistory();
    var c = centroidOf(ids, sc);
    ids.forEach(function(id){ sc.positions[id].x = c.x; });
    markDirty(); render();
  }
  function alignCenterY(ids, sc){
    if(!ids.length) return; pushHistory();
    var c = centroidOf(ids, sc);
    ids.forEach(function(id){ sc.positions[id].y = c.y; });
    markDirty(); render();
  }
  function equalizeSpacing(ids, sc){
    if(ids.length<3) return; pushHistory();
    var pts = ids.map(function(id){ return {id:id, p:sc.positions[id]}; });
    var xs = pts.map(function(o){ return o.p.x; }), ys = pts.map(function(o){ return o.p.y; });
    var wide = (Math.max.apply(null,xs)-Math.min.apply(null,xs)) >= (Math.max.apply(null,ys)-Math.min.apply(null,ys));
    pts.sort(function(a,b){ return wide ? a.p.x-b.p.x : a.p.y-b.p.y; });
    var n = pts.length;
    if(wide){
      var minX=pts[0].p.x, maxX=pts[n-1].p.x;
      pts.forEach(function(o,i){ o.p.x = minX + (maxX-minX)*i/(n-1); });
    } else {
      var minY=pts[0].p.y, maxY=pts[n-1].p.y;
      pts.forEach(function(o,i){ o.p.y = minY + (maxY-minY)*i/(n-1); });
    }
    markDirty(); render();
  }
  function mirrorSelection(ids, sc){
    if(!ids.length) return; pushHistory();
    var xs = ids.map(function(id){ return sc.positions[id].x; });
    var minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
    ids.forEach(function(id){ sc.positions[id].x = minX+maxX-sc.positions[id].x; });
    markDirty(); render();
  }
  function removeSelectionFromScene(ids, sc){
    if(!ids.length) return; pushHistory();
    ids.forEach(function(id){ sc.presence[id]=false; delete sc.positions[id]; });
    removeFromAllGroups(sc, ids);
    ui.selectedIds=[];
    markDirty(); render();
  }
  function autoArrangeAll(sc){
    var ids = state.members.filter(function(m){ return sc.presence[m.id]; }).map(function(m){ return m.id; });
    var cols = Math.ceil(Math.sqrt(ids.length*1.6));
    var rows = Math.ceil(ids.length/cols);
    ids.forEach(function(id,i){
      var r = Math.floor(i/cols), cidx = i%cols;
      var rowCount = Math.min(cols, ids.length-r*cols);
      var x = 50 + (cidx-(rowCount-1)/2)*(70/Math.max(cols,1));
      var y = 20 + r*(60/Math.max(rows-1,1));
      setPos(sc, id, x, ids.length<=1?50:y);
    });
  }
  function copyPreviousArrangement(sc){
    var idx = sceneIndex(sc.id);
    if(idx<=0) return;
    pushHistory();
    var prev = state.scenes[idx-1];
    sc.positions = JSON.parse(JSON.stringify(prev.positions));

      for(i=1;i<cols;i++){

      g.push('<line x1="'+VB_W+'" y1="0" x2="0" y2="'+VB_H+'" style="stroke:var(--hue-amber);stroke-width:1.75;stroke-dasharray:4 5;opacity:.9;"></line>');

  function renderPaths(scene){
    if(!scene.showIncomingPath) return '';
    var idx = sceneIndex(scene.id);
    if(idx <= 0) return '';
    var prev = state.scenes[idx-1];
    var out = ['<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" style="fill:var(--text-muted);"></path></marker></defs>'];
    Object.keys(scene.positions).forEach(function(id){
      if(!prev.positions[id] || !prev.presence[id]) return;
      var a = prev.positions[id], b = scene.positions[id];
      var skill = b.tumbleSkill;
      var dash = skill ? '7 3 1 3' : '4 4';
      var lineColor = skill ? 'var(--hue-rust)' : 'var(--text-muted)';
      var trace = (scene.useActualPath && b.path && b.path.length>1) ? b.path : null;
      if(trace){
        var d = 'M ' + trace.map(function(p){ return (p.x/100*VB_W)+' '+(p.y/100*VB_H); }).join(' L ');
        out.push('<path class="motion-path" data-member-id="'+id+'" d="'+d+'" fill="none" style="stroke:'+lineColor+';stroke-width:1.5;stroke-dasharray:'+dash+';opacity:.65;" marker-end="url(#arrow)"></path>');
      } else {
        var ax=a.x/100*VB_W, ay=a.y/100*VB_H, bx=b.x/100*VB_W, by=b.y/100*VB_H;
        if(Math.abs(ax-bx)<1 && Math.abs(ay-by)<1) return;
        out.push('<line class="motion-path" data-member-id="'+id+'" x1="'+ax+'" y1="'+ay+'" x2="'+bx+'" y2="'+by+'" style="stroke:'+lineColor+';stroke-width:1.5;stroke-dasharray:'+dash+';opacity:.65;" marker-end="url(#arrow)"></line>');
      }
      if(skill && TUMBLE_SKILLS[skill]){
        var lx = b.x/100*VB_W, ly = b.y/100*VB_H - 34;
        out.push('<text x="'+lx+'" y="'+ly+'" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--hue-rust);font-family:Manrope,sans-serif;pointer-events:none;">'+escapeHtml(TUMBLE_SKILLS[skill])+'</text>');
      }
    });
    return out.join('');
  }

  function fitStageFrame(){
    var panel = document.querySelector('.stage-panel');
    var row = document.querySelector('.stage-row');
    var frame = document.querySelector('.stage-frame');
    if(!panel || !row || !frame) return;
    frame.style.width = ''; frame.style.height = '';
    var panelRect = panel.getBoundingClientRect();
    var cs = getComputedStyle(panel);
    var padV = (parseFloat(cs.paddingTop)||0) + (parseFloat(cs.paddingBottom)||0);
    var padH = (parseFloat(cs.paddingLeft)||0) + (parseFloat(cs.paddingRight)||0);
    var gap = parseFloat(cs.rowGap||cs.gap)||0;
    var siblingsH = 0, siblingCount = 0;
    Array.prototype.forEach.call(panel.children, function(ch){
      if(ch===row) return;
      siblingsH += ch.getBoundingClientRect().height;
      siblingCount++;
    });
    var availH = panelRect.height - padV - siblingsH - gap*siblingCount;
    var rowRect = row.getBoundingClientRect();
    var rowCs = getComputedStyle(row);
    var rowGap = parseFloat(rowCs.columnGap||rowCs.gap)||0;
    var rowSiblingsW = 0, rowSiblingCount = 0;
    Array.prototype.forEach.call(row.children, function(ch){
      if(ch===frame) return;
      rowSiblingsW += ch.getBoundingClientRect().width;
      rowSiblingCount++;
    });
    var availW = rowRect.width - rowSiblingsW - rowGap*rowSiblingCount;
    var w = availW, h = w*0.7;
    if(h > availH){ h = Math.max(80, availH); w = h/0.7; }
    frame.style.width = Math.max(160, w)+'px';
    frame.style.height = Math.max(112, h)+'px';
  }
  window.addEventListener('resize', function(){ fitStageFrame(); positionYtPortal(); });
  var stageResizeObserver = (typeof ResizeObserver!=='undefined') ? new ResizeObserver(function(){ fitStageFrame(); }) : null;
  function observeStagePanelResize(){
    if(!stageResizeObserver) return;
    stageResizeObserver.disconnect();
    var eb = document.querySelector('.editor-body');
    if(eb) stageResizeObserver.observe(eb);
  }

      if(state.updatedAt) return (ui.dirty?'未保存の変更あり・':'最終保存 ') + fmtTime(state.updatedAt);
      return ui.dirty ? '未保存の変更があります' : '未保存';
    }
    if(cfDb){
      if(ui.saveStatus==='saving') return 'クラウドに保存中…';
      if(ui.saveStatus==='saved') return cloudProjectId ? 'クラウドに保存済み・共有リンク有効' : 'この端末に保存済み';
      if(ui.saveStatus==='error') return 'クラウド保存に失敗（この端末には保存済み）';

      return ui.dirty ? '未保存の変更があります' : (cloudProjectId ? 'クラウドに保存済み' : 'この端末に保存済み');

  /* ================= export ================= */
  function resolveSvgColors(svgStr){
    var cs = getComputedStyle(document.documentElement);
    return svgStr.replace(/var\((--[a-z-]+)\)/g, function(m, name){
      var v = cs.getPropertyValue(name);
      return v ? v.trim() : '#000';
    });
  }
  function svgToPngBlob(svgString, width, height){
    return new Promise(function(resolve, reject){
      var blob = new Blob([svgString], {type:'image/svg+xml;charset=utf-8'});
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function(){
        var canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        canvas.toBlob(function(b){ b ? resolve(b) : reject(new Error('toBlob failed')); }, 'image/png');
      };
      img.onerror = function(e){ URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }
  function standaloneSvg(scene){
    var markup = renderStageSvg(scene, {mini:false}).replace(' stage-main','');
    markup = markup.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="'+VB_W+'" height="'+VB_H+'" ');
    return resolveSvgColors(markup);
  }
  function downloadViaBlobLink(filename, data){
    var blob = (data instanceof Blob) ? data : new Blob([data], {type:'application/octet-stream'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }
  function saveViaDownloads(filename, data){
    if(hasArtifactApi){
      // Inside the Claude Artifact sandbox a plain <a download> link is inert,
      // so this path must go through the downloads capability or fail visibly.
      window.claude.use('downloads').then(function(dl){
        if(!dl){ alert('この表示環境ではダウンロードが許可されていません。自己ホスティングした環境ではダウンロードできます。'); return; }
        dl.save({ filename:filename, data:data }).catch(function(err){
          if(err && err.code==='declined') return;
          alert('書き出しに失敗しました: '+(err&&err.message||''));
        });
      }, function(){ alert('この表示環境ではダウンロードが許可されていません。自己ホスティングした環境ではダウンロードできます。'); });
    } else {
      downloadViaBlobLink(filename, data);
    }
  }
  function exportCurrentPng(){
    var sc = currentScene();
    svgToPngBlob(standaloneSvg(sc), VB_W, VB_H).then(function(blob){
      saveViaDownloads((sc.name||'scene')+'.png', blob);
    }).catch(function(){ alert('PNGの生成に失敗しました。'); });
  }
  function exportContactSheet(scenes, filename){
    var cols = Math.ceil(Math.sqrt(scenes.length));
    var rows = Math.ceil(scenes.length/cols);
    var cw = 320, ch = Math.round(cw*VB_H/VB_W)+26;
    var promises = scenes.map(function(sc){ return svgToPngBlob(standaloneSvg(sc), VB_W, VB_H); });
    Promise.all(promises).then(function(blobs){
      var canvas = document.createElement('canvas');
      canvas.width = cols*cw; canvas.height = rows*ch;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      var loaded = blobs.map(function(b){ return new Promise(function(res){
        var img = new Image();
        img.onload = function(){ res(img); };
        img.src = URL.createObjectURL(b);
      }); });
      Promise.all(loaded).then(function(imgs){
        imgs.forEach(function(img, i){
          var r = Math.floor(i/cols), c = i%cols;
          var x = c*cw, y = r*ch;
          ctx.drawImage(img, x, y, cw, cw*VB_H/VB_W);
          ctx.fillStyle = '#333'; ctx.font = '14px sans-serif';
          ctx.fillText((i+1)+'. '+(scenes[i].name||''), x+4, y+ch-6);
        });
        canvas.toBlob(function(blob){ saveViaDownloads(filename, blob); }, 'image/png');
      });
    }).catch(function(){ alert('コンタクトシートの生成に失敗しました。'); });
  }
  function exportContactSheetPng(){ exportContactSheet(state.scenes, 'contact-sheet.png'); }
  function exportContactSheetCurrentPng(){ exportContactSheet([currentScene()], 'contact-sheet-'+(currentScene().name||'scene')+'.png'); }
  function exportPdfAllScenes(){
    var PER_PAGE = 8;
    var pages = [];
    for(var i=0;i<state.scenes.length;i+=PER_PAGE){ pages.push(state.scenes.slice(i,i+PER_PAGE)); }
    PRINT_AREA.innerHTML = pages.map(function(pageScenes, pageIdx){
      var cells = pageScenes.map(function(sc, idxInPage){
        var i = pageIdx*PER_PAGE+idxInPage;
        var sect = SECTION_DEFS[sc.section] || SECTION_DEFS.transition;
        var cn = sc.countNotes || {};
        var cnCells = [];
        for(var c=1;c<=8;c++){ cnCells.push('<div>'+c+': '+escapeHtml(cn[c]||'')+'</div>'); }
        return '<div class="print-cell">' +
          '<h3>'+(i+1)+'. '+escapeHtml(sc.name||'無題')+' ・ '+sect.label+' ・ '+escapeHtml(sceneTimeDisplay(sc))+'</h3>' +
          renderStageSvg(sc,{mini:false}).replace(' stage-main','') +
          '<div class="print-memo">'+escapeHtml(sc.note||'')+'</div>' +
          '<div class="print-countnotes">'+cnCells.join('')+'</div>' +
        '</div>';
      }).join('');
      return '<div class="print-page">'+cells+'</div>';
    }).join('');
    window.print();
  }

    on('toggleActualPath','change', function(){ pushHistory(); currentScene().useActualPath=this.checked; markDirty(); render(); });
    onAll('[data-act="count-note"]','change', function(){
      pushHistory();
      var c = this.getAttribute('data-c');
      var sc = currentScene();
      sc.countNotes = sc.countNotes || {};
      sc.countNotes[c] = this.value;
      markDirty(); render();
    });

    /* roster tab */
    on('memberAddBtn','click', function(){ pushHistory(); state.members.push({ id:uid('m'), name:'新しいメンバー', part:'other', color:nextKomaColor(state.members.length) }); markDirty(); render(); });
    onAll('[data-act="member-name"]','change', function(){
      pushHistory();
      var id=this.closest('.roster-row').getAttribute('data-id');
      var m=member(id); if(m){ m.name=this.value; markDirty(); render(); }
    });
    onAll('[data-act="member-color"]','change', function(){
      pushHistory();
      var id=this.closest('.roster-row').getAttribute('data-id');
      var m=member(id); if(m){ m.color=this.value; markDirty(); render(); }
    });
    onAll('[data-act="member-part"]','change', function(){
      pushHistory();
      var id=this.closest('.roster-row').getAttribute('data-id');
      var m=member(id); if(m){ m.part=this.value; markDirty(); render(); }
    });
    onAll('[data-act="member-del"]','click', function(){
      pushHistory();
      var id=this.getAttribute('data-id');
      state.members = state.members.filter(function(x){return x.id!==id;});
      state.scenes.forEach(function(s){ delete s.presence[id]; delete s.positions[id]; removeFromAllGroups(s,[id]); });
      markDirty(); render();
    });
    on('bulkAddBtn','click', function(){
      pushHistory();
      var ta=document.getElementById('bulkNames');
      var lines=ta.value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
      lines.forEach(function(n){ state.members.push({ id:uid('m'), name:n, part:'other', color:nextKomaColor(state.members.length) }); });
      ta.value=''; markDirty(); render();
    });

    /* stage settings tab */
    bindField('stageWidth', function(v){ pushHistory(); state.stage.widthM=parseFloat(v)||8; });
    bindField('stageDepth', function(v){ pushHistory(); state.stage.depthM=parseFloat(v)||6; });
    bindField('frontCount', function(v){ pushHistory(); state.stage.frontCount=Math.max(1,parseInt(v,10)||9); });
    bindField('frontLabels', function(v){ pushHistory(); state.stage.frontLabels=v; });
    bindField('depthCount', function(v){ pushHistory(); state.stage.depthCount=Math.max(1,parseInt(v,10)||6); });
    bindField('depthLabels', function(v){ pushHistory(); state.stage.depthLabels=v; });
    on('projectMemo','change', function(){ pushHistory(); state.projectMemo=this.value; markDirty(); render(); });
    ['showGrid','showFrontNumbers','showDepthNumbers','showCenter','showDiagonal','showThirds','showRoleBadges'].forEach(function(key){
      on(key,'change', function(){ pushHistory(); state.stage[key]=this.checked; markDirty(); render(); });
    });
    /* stunt drawer */
    wireStageEvents();
  }

  function swapScenes(i,j){ var tmp=state.scenes[i]; state.scenes[i]=state.scenes[j]; state.scenes[j]=tmp; }
  function duplicateScene(idx, flip){
    var src = state.scenes[idx];
    var positions = {};
    Object.keys(src.positions).forEach(function(id){
      var p = src.positions[id];
      positions[id] = { x: flip ? 100-p.x : p.x, y: p.y };
    });
    var groups = (src.groups||[]).map(function(g){
      return { id:uid('grp'), type:g.type, stuntType:g.stuntType, memberIds:g.memberIds.slice() };
    });
    var copy = {
      id:uid('sc'), name: src.name + (flip?'（反転）':'のコピー'), section:src.section, color:src.color,
      timeLabel:src.timeLabel, startSec:null, countNotes:Object.assign({}, src.countNotes||{}),
      note:src.note, videoLink:src.videoLink, lightingNote:src.lightingNote,
      showIncomingPath:src.showIncomingPath, useActualPath:false,
      presence:Object.assign({}, src.presence), positions:positions, groups:groups
    };
    state.scenes.splice(idx+1, 0, copy);
    state.currentSceneId = copy.id;
  }
  function addScene(opts){
    opts = opts || {};
    var sc = currentScene();
    var ns = {
      id:uid('sc'), name:'新しいシーン', section:'transition', color:'#8d8698', timeLabel:'',
      startSec: opts.startSec!=null ? opts.startSec : null,
      countNotes:{},
      note:'', videoLink:'', lightingNote:'', showIncomingPath:true, useActualPath:false,
      presence: sc ? Object.assign({}, sc.presence) : {},
      positions: sc ? JSON.parse(JSON.stringify(sc.positions)) : {},
      groups: sc ? JSON.parse(JSON.stringify(sc.groups||[])) : []
    };
    var idx = sc ? sceneIndex(sc.id) : state.scenes.length-1;
    pushHistory();
    state.scenes.splice(idx+1, 0, ns);
    state.currentSceneId = ns.id;
    markDirty(); render();
  }
  function generateCountScenes(){
    var cs = ui.countSplit;
    if(!cs || !(cs.bpm>0) || cs.markA==null) return;
    var interval = 60/cs.bpm*8;
    var dur = playbackDuration();
    var n = Math.max(0, Math.floor((dur - cs.markA)/interval)) + 1;
    if(n<1) return;
    if(!confirm('『'+fmtAudioTime(cs.markA)+'』からBPM'+cs.bpm+'（8カウント='+interval.toFixed(2)+'秒）間隔で、シーンを'+n+'個追加します。よろしいですか？')) return;
    pushHistory();
    var baseSc = currentScene();
    var idx = baseSc ? sceneIndex(baseSc.id) : state.scenes.length-1;
    var baseCount = state.scenes.length;
    var firstNewId = null;
    for(var i=0;i<n;i++){
      var t = cs.markA + i*interval;
      var ns = {
        id:uid('sc'), name:'シーン'+(baseCount+i+1), section:'transition', color:'#8d8698', timeLabel:'',
        startSec:t, countNotes:{},
        note:'', videoLink:'', lightingNote:'', showIncomingPath:true, useActualPath:false,
        presence: baseSc ? Object.assign({}, baseSc.presence) : {},
        positions: baseSc ? JSON.parse(JSON.stringify(baseSc.positions)) : {},
        groups: baseSc ? JSON.parse(JSON.stringify(baseSc.groups||[])) : []
      };
      state.scenes.splice(idx+1+i, 0, ns);
      if(i===0) firstNewId = ns.id;
    }
    state.currentSceneId = firstNewId;
    ui.countSplit = {open:false, bpm:null, markA:null};
    markDirty(); render();
  }

  /* ---------------- stage interaction: select / marquee / drag / context menu ---------------- */
  function wireStageEvents(){
    var svg = document.querySelector('.stage-main');
    if(!svg) return;

    var mode = null;
    var dragIds = [];
    var dragStart = null;
    var origPositions = {};
    var marqueeRect = null;
    var didDrag = false;
    var longPressTimer = null;
    function clearLongPress(){ if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; } }

    function svgPoint(clientX, clientY){
      var pt = svg.createSVGPoint();
      pt.x=clientX; pt.y=clientY;
      var m = svg.getScreenCTM();
      if(!m) return {x:0,y:0};
      var p = pt.matrixTransform(m.inverse());
      return {x:p.x, y:p.y};
    }
    function snap(v){
      if(!state.stage.snapGrid) return v;
      var step = 100/(state.stage.frontCount||9);
      return Math.round(v/step)*step;
    }

    svg.addEventListener('pointerdown', function(e){
      if(e.button===2) return;
      var badgeEl = e.target.closest ? e.target.closest('.stunt-badge') : null;
      if(badgeEl){
        ui.boardPopover = { type:'stunt', gid:badgeEl.getAttribute('data-gid'), x:e.clientX, y:e.clientY };
        render();
        return;
      }
      if(ui.boardPopover){ ui.boardPopover = null; render(); return; }
      var el = e.target.closest ? e.target.closest('.koma') : null;
      didDrag = false;
      clearLongPress();
      var sc = currentScene();
      if(el){
        var id = el.getAttribute('data-member-id');
        if(e.shiftKey){
          var i = ui.selectedIds.indexOf(id);
          if(i>=0) ui.selectedIds.splice(i,1); else ui.selectedIds.push(id);
          render();
          return;
        }
        var grp = groupContaining(sc, id);
        dragIds = grp ? grp.memberIds.slice() : [id];
        ui.selectedIds = dragIds.slice();
        mode = 'drag';
        dragStart = svgPoint(e.clientX, e.clientY);
        origPositions = {};
        dragIds.forEach(function(mid){ origPositions[mid] = { x:sc.positions[mid].x, y:sc.positions[mid].y }; });
        if(sc.useActualPath){ dragIds.forEach(function(mid){ sc.positions[mid].path = [{x:sc.positions[mid].x,y:sc.positions[mid].y}]; }); }
        try{ svg.setPointerCapture(e.pointerId); }catch(err){}
        e.preventDefault();
        if(!grp){
          var lpClientX=e.clientX, lpClientY=e.clientY;
          longPressTimer = setTimeout(function(){
            longPressTimer = null;
            if(mode==='drag' && !didDrag){
              mode = null; dragIds=[]; dragStart=null;
              ui.boardPopover = { type:'tumbleMenu', memberId:id, x:lpClientX, y:lpClientY };
              render();
            }
          }, 550);
        }
      } else {
        mode = 'marquee';
        dragStart = svgPoint(e.clientX, e.clientY);
        marqueeRect = document.createElementNS('http://www.w3.org/2000/svg','rect');
        marqueeRect.setAttribute('fill', 'var(--accent)');
        marqueeRect.setAttribute('fill-opacity','0.12');
        marqueeRect.setAttribute('stroke','var(--accent)');
        marqueeRect.setAttribute('stroke-width','1.5');
        marqueeRect.setAttribute('x', dragStart.x); marqueeRect.setAttribute('y', dragStart.y);
        marqueeRect.setAttribute('width',0); marqueeRect.setAttribute('height',0);
        svg.appendChild(marqueeRect);
        try{ svg.setPointerCapture(e.pointerId); }catch(err){}
      }
    });

    svg.addEventListener('pointermove', function(e){
      if(mode==='drag'){
        if(!didDrag){ pushHistory(); didDrag = true; clearLongPress(); }
        var sc = currentScene();
        var p = svgPoint(e.clientX, e.clientY);
        var dx = (p.x-dragStart.x)/VB_W*100, dy=(p.y-dragStart.y)/VB_H*100;
        dragIds.forEach(function(mid){
          var np = { x:clampPct(snap(origPositions[mid].x+dx)), y:clampPct(snap(origPositions[mid].y+dy)) };
          var old = sc.positions[mid];
          if(sc.useActualPath && old && old.path){ np.path = old.path.concat([{x:np.x,y:np.y}]).slice(-200); }
          sc.positions[mid] = np;
          var g2 = svg.querySelector('.koma[data-member-id="'+mid+'"]');
          if(g2) g2.setAttribute('transform','translate('+(np.x/100*VB_W)+','+(np.y/100*VB_H)+')');
        });
        markDirty();
      } else if(mode==='marquee'){
        var p2 = svgPoint(e.clientX, e.clientY);
        var x = Math.min(p2.x, dragStart.x), y = Math.min(p2.y, dragStart.y);
        var w = Math.abs(p2.x-dragStart.x), h = Math.abs(p2.y-dragStart.y);
        marqueeRect.setAttribute('x',x); marqueeRect.setAttribute('y',y);
        marqueeRect.setAttribute('width',w); marqueeRect.setAttribute('height',h);
      }
    });

    function endInteraction(){
      clearLongPress();
      if(mode==='marquee' && marqueeRect){
        var x = parseFloat(marqueeRect.getAttribute('x')), y=parseFloat(marqueeRect.getAttribute('y'));
        var w = parseFloat(marqueeRect.getAttribute('width')), h=parseFloat(marqueeRect.getAttribute('height'));
        if(w>4 || h>4){
          var sc = currentScene();
          var picked = [];
          state.members.forEach(function(m){
            if(!sc.presence[m.id] || !sc.positions[m.id]) return;
            var pos = sc.positions[m.id];
            var vx = pos.x/100*VB_W, vy = pos.y/100*VB_H;
            if(vx>=x && vx<=x+w && vy>=y && vy<=y+h) picked.push(m.id);
          });
          ui.selectedIds = picked;
        } else {
          ui.selectedIds = [];
        }
        marqueeRect.remove(); marqueeRect=null;
        render();
      } else if(mode==='drag'){
        render();
      }
      mode=null; dragIds=[]; dragStart=null;
    }
    svg.addEventListener('pointerup', endInteraction);
    svg.addEventListener('pointercancel', endInteraction);

    svg.addEventListener('contextmenu', function(e){
      e.preventDefault();
      var el = e.target.closest ? e.target.closest('.koma') : null;
      if(!el) return;
      var id = el.getAttribute('data-member-id');
      var sc = currentScene();
      var g = groupContaining(sc, id);
      ui.selectedIds = g ? g.memberIds.slice() : [id];
      render();
    });
  }

  /* ---------------- present ---------------- */
  function wirePresentEvents(){
    on('presentClose','click', stopPresent);
    on('presentPrev','click', function(){ presentGo(ui.presentIndex-1); });
    on('presentNext','click', function(){ presentGo(ui.presentIndex+1); });
    on('presentPlay','click', togglePresentPlay);
    onAll('.present-dots button','click', function(){ presentGo(parseInt(this.getAttribute('data-idx'),10)); });
    document.onkeydown = function(e){
      if(!ui.present) return;
      if(e.key==='Escape') stopPresent();
      else if(e.key==='ArrowRight') presentGo(ui.presentIndex+1);
      else if(e.key==='ArrowLeft') presentGo(ui.presentIndex-1);
    };
  }
  function presentGo(i){
    if(i<0 || i>=state.scenes.length) return;
    var fromIndex = ui.presentIndex;
    var shouldAnimate = (i===fromIndex+1) && !prefersReducedMotion();
    var fromScene = state.scenes[fromIndex];
    var target = state.scenes[i];
    if(hasAudioSource() && target.startSec!=null && Math.abs(playbackTime()-target.startSec)>0.5){
      playbackSeek(target.startSec);
    }
    ui.presentIndex=i; state.currentSceneId=target.id; render();
    if(shouldAnimate && fromScene) runPresentTransitionAnimation(fromScene, target);
  }
  function runPresentTransitionAnimation(fromScene, toScene){
    var svg = document.querySelector('.present-stage-wrap .stage-svg');
    if(!svg) return;
    var DURATION = 650;
    var toMove = [];
    Array.prototype.forEach.call(svg.querySelectorAll('.koma[data-member-id]'), function(el){
      var id = el.getAttribute('data-member-id');
      var fromPos = fromScene.positions[id], toPos = toScene.positions[id];
      if(fromPos && fromScene.presence[id] && toPos){
        var fx = fromPos.x/100*VB_W, fy = fromPos.y/100*VB_H;
        var tx = toPos.x/100*VB_W, ty = toPos.y/100*VB_H;
        el.style.transition = 'none';
        el.setAttribute('transform','translate('+fx+','+fy+')');
        toMove.push({ el:el, x:tx, y:ty });
      }
    });
    var toReveal = [];
    Array.prototype.forEach.call(svg.querySelectorAll('.motion-path[data-member-id]'), function(el){
      var len = el.getTotalLength ? el.getTotalLength() : 0;
      el.style.transition = 'none';
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len;
      toReveal.push(el);
    });
    void svg.getBoundingClientRect();
    requestAnimationFrame(function(){
      toMove.forEach(function(o){
        o.el.style.transition = 'transform '+DURATION+'ms ease';
        o.el.setAttribute('transform','translate('+o.x+','+o.y+')');
      });
      toReveal.forEach(function(el){
        el.style.transition = 'stroke-dashoffset '+DURATION+'ms linear';
        el.style.strokeDashoffset = '0';
      });
    });
  }
  function togglePresentPlay(){
    if(hasAudioSource()){
      playbackTogglePlay();
      ui.presentPlaying = !playbackIsPaused();
      render();
      return;
    }
    ui.presentPlaying = !ui.presentPlaying;
    if(ui.presentPlaying){
      ui.presentTimer = setInterval(function(){
        var ni = ui.presentIndex+1;
        if(ni>=state.scenes.length){ ui.presentPlaying=false; clearInterval(ui.presentTimer); render(); return; }
        presentGo(ni);
      }, 3500);
    } else if(ui.presentTimer){ clearInterval(ui.presentTimer); }
    render();
  }
  function stopPresent(){
    if(ui.presentTimer) clearInterval(ui.presentTimer);
    if(hasAudioSource() && !playbackIsPaused()) playbackTogglePlay();
    ui.present=false; ui.presentPlaying=false; document.onkeydown=null;
    render();
  }

  /* ================= global keyboard (undo/redo) ================= */
  document.addEventListener('keydown', function(e){
    if(ui.present) return;
    var tag = document.activeElement ? document.activeElement.tagName : '';
    if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT') return;
    var mod = e.ctrlKey || e.metaKey;
    if(mod && e.key.toLowerCase()==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
    else if(mod && (e.key.toLowerCase()==='y' || (e.key.toLowerCase()==='z' && e.shiftKey))){ e.preventDefault(); redo(); }
  });

  /* ================= save ================= */
  function buildFullHtml(s){
    var json = JSON.stringify(s).replace(/<\/script/gi, '<\\/script');
    return '<!doctype html>\n<html lang="ja">\n' + HEAD_HTML + '\n<body>\n<div id="root"></div>\n' +
      '<script id="app-state" type="application/json">' + json + '<\/script>\n' + SCRIPT_HTML + '\n</body>\n</html>';
  }
  function handleSave(){
    if(ui.isReadOnly) return;
    if(hasArtifactApi){
      ui.saveStatus='saving'; render();
      window.claude.use('artifact').then(function(artifact){
        if(!artifact){ ui.saveStatus='unavailable'; render(); return; }
        state.updatedAt = new Date().toISOString();
        var html = buildFullHtml(state);
        artifact.publish(html).then(function(){
          ui.saveStatus='saved'; ui.dirty=false; render();
        }, function(err){
          if(err && (err.code==='not_writer' || err.code==='not_granted')){
            ui.isReadOnly = true; ui.saveStatus='idle'; render();
          } else if(err && err.code==='conflict'){
            ui.saveStatus='idle'; render();
          } else {
            ui.saveStatus='error'; render();
          }
        });
      }, function(){ ui.saveStatus='unavailable'; render(); });
      return;
    }
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
    if(!cfDb){ ui.dirty=false; render(); return; }
    state.updatedAt = new Date().toISOString();
    var payload;
    try{ payload = JSON.parse(JSON.stringify(state)); }catch(e){ payload = null; }
    if(!payload || new Blob([JSON.stringify(payload)]).size > 900000){
      ui.dirty=false; ui.saveStatus='toolarge'; render();
      return;
    }
    ui.saveStatus='saving'; render();
    var isNew = !cloudProjectId;
    var docId = cloudProjectId || cfDb.collection('projects').doc().id;
    cfDb.collection('projects').doc(docId).set({
      state: payload,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function(){
      cloudProjectId = docId;
      if(isNew){
        try{
          var url = new URL(window.location.href);
          url.searchParams.set('p', docId);
          history.replaceState(null, '', url.toString());
        }catch(e){}
      }
      ui.dirty=false; ui.saveStatus='saved'; render();
    }).catch(function(){
      ui.dirty=false; ui.saveStatus='error'; render();
    });
  }

  function applyLoadedState(s){
    state = s;
    if(state.hasProject===undefined) state.hasProject = !!(state.scenes && state.scenes.length);
    state.stage = state.stage || defaultStage();
    state.audio = state.audio || { dataUrl:'', name:'', sourceType:'file', youtubeUrl:'' };
    if(!state.audio.sourceType) state.audio.sourceType = state.audio.dataUrl ? 'file' : 'file';
    ensureMemberColors(state);
    if(state.audio.dataUrl) AUDIO_EL.src = state.audio.dataUrl;
  }

  if(cloudProjectId && cfDb){
    root.innerHTML = '<div style="padding:60px 20px;text-align:center;color:var(--text-muted)">読み込み中…</div>';
    cfDb.collection('projects').doc(cloudProjectId).get().then(function(doc){
      if(doc.exists && doc.data() && doc.data().state){
        applyLoadedState(doc.data().state);
      } else {
        cloudProjectId = null;
        try{ history.replaceState(null, '', window.location.pathname); }catch(e){}
      }
      render();
    }).catch(function(){
      cloudProjectId = null;
      render();
    });
  } else {
    render();
  }
})();
</script>
